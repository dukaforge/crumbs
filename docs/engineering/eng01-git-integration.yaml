id: eng01-git-integration
title: Git Integration
introduction: |
  This guideline describes how Crumbs integrates with git. The core rule is simple: JSONL
  files always live on main. Issue state is independent of code branches. Developers work
  on feature branches for code; the cupboard is always consulted from the data directory,
  which is a fixed path resolved from configuration. See prd012-branch-independent-data
  for the requirements that govern this design.
sections:
- title: Data Directory in Git
  content: |
    JSONL files are the source of truth for the SQLite backend (see ARCHITECTURE Decision 6). We
    commit them to git so that issue state is versioned and recoverable. The SQLite database
    (cupboard.db) is ephemeral and rebuilt from JSONL on every Attach. It must not be committed.

    JSONL files are always committed to main. They do not travel with feature branches or task
    branches. A developer working on a code branch still reads and writes issue state through
    the data directory; the cupboard is not branch-scoped.

    Table 1 Files in git

    | File | Git status |
    |------|-----------|
    | *.jsonl (crumbs, trails, links, properties, etc.) | Committed to main |
    | cupboard.db | Gitignored |
    | config.yaml | Committed (per-repo configuration) |

    The .gitignore must include cupboard.db to prevent accidental commits of the binary database.
- title: Trails and Git Branches
  content: |
    Trails and git branches serve different purposes. Trails are persistent DAG records of work
    structure that stay in the cupboard when closed or abandoned. Git branches are ephemeral
    workspaces for code that are created, merged, and deleted.

    Table 2 Trails vs git branches

    | Concept | Lifetime | Structure | Purpose |
    |---------|----------|-----------|---------|
    | Trail | Persistent (closed or abandoned in place) | DAG of crumbs | Record what work happened and how it branched |
    | Git branch | Ephemeral (merged and deleted) | Linear commits | Deliver code changes to the base branch |

    A trail does not merge into anything. When a trail is completed, its crumbs become permanent
    records. When a trail is abandoned, its crumbs are deleted. In both cases the trail itself
    remains in the cupboard as a historical record. Trail lifecycle is managed through the
    Cupboard API, not through git. Abandoning or deleting a code branch has no effect on trails
    or crumbs.
- title: Commit Conventions
  content: |
    Commit messages reference crumb IDs for traceability. This enables bidirectional navigation
    between issue state and code history without storing git hashes inside crumbs.

    Table 3 Traceability directions

    | Direction | How |
    |-----------|-----|
    | Commit to crumbs | Read the diff: JSONL changes on main show which crumbs were affected |
    | Crumb to commits | git log --all --grep="<crumb-id>" finds all commits that reference the crumb |

    A single crumb typically spans multiple commits. The commit history captures the full
    relationship.
- title: Main Branch as Source of Truth
  content: |
    Main always holds the complete, current state of the project: all open, completed, and
    abandoned crumbs, all trails, all links, and all properties. JSONL changes are committed
    to main when issue state changes, independent of any in-progress code branch.

    Developers on feature branches do not need to merge before consulting or updating issue
    state. The data directory is a fixed path resolved from configuration; it is not scoped to
    a branch or worktree.
