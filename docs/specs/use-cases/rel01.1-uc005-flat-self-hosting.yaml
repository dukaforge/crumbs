id: rel01.1-uc005-flat-self-hosting
title: Flat Self-Hosting
summary: 'The cupboard CLI tracks development work on the crumbs repository using
  only

  core storage features. The do-work.sh and make-work.sh scripts run end-to-end

  using generic table commands (get, set, list, delete) and crumb commands.

  This validates that cupboard works as an issue tracker for real agent workflows

  without requiring properties, trails, or epics.

  '
actor: Coding agent (e.g., Claude Code) working on the crumbs codebase via do-work.sh and make-work.sh scripts
trigger: Cupboard CLI providing the table and crumb commands that scripts need
flow:
  - F1: "Initialize cupboard: run cupboard init to create data directory and empty JSONL files"
  - F2: "Create crumbs via generic table command (requires initialized cupboard from F1): run cupboard set crumbs '' '{\"Name\":\"...\",\"State\":\"draft\"}'"
  - F3: "List crumbs via generic table command (requires crumbs from F2): run cupboard list crumbs to see all crumbs as JSON"
  - F4: "Update crumb state via generic table command (requires crumb ID from F2): run cupboard set crumbs <id> '{...}' to change state"
  - F5: "Get crumb details via generic table command (requires crumb ID from F2): run cupboard get crumbs <id> to view a single crumb"
  - F6: "Delete crumbs via generic table command (requires crumb ID from F2): run cupboard delete crumbs <id> to remove a crumb"
  - F7: "Integrate do-work.sh script (exercises F3-F4 in sequence): use cupboard commands to pick a task, claim it, and close it after completion"
  - F8: "Integrate make-work.sh script (exercises F2-F3): use cupboard commands to list existing issues and create new ones"
  - F9: "Commit JSONL files to git (after F7/F8 complete): per eng01-git-integration, JSONL files are committed as part of session completion"
touchpoints:
  - T1: "cupboard CLI (cmd/cupboard): generic table commands get, set, list, delete (srd009-cupboard-cli R3)"
  - T2: "Cupboard library (pkg/types): Cupboard interface with GetTable, Table interface for CRUD (srd001-cupboard-core R2, R3)"
  - T3: "SQLite backend (internal/sqlite): storage, JSONL persistence, query engine (srd002-sqlite-backend R1-R5)"
  - T4: "Crumb entity (pkg/types): Name, State, CreatedAt, UpdatedAt fields (srd003-crumbs-interface R1)"
  - T5: "do-work.sh: task picking (list with filter), worktree management, agent invocation"
  - T6: "make-work.sh: work creation (set with empty ID), issue listing"
  - T7: ".claude/rules/: agent workflow instructions (eng01-git-integration)"
success_criteria:
  - id: S1
    criterion: do-work.sh completes a full cycle (pick draft task, claim by setting state to taken, close by setting state to pebble) using only generic table commands, confirming that cupboard serves as a working issue tracker for agent workflows
    traces:
      - srd009-cupboard-cli AC3
      - srd003-crumbs-interface AC2
  - id: S2
    criterion: make-work.sh creates issues via cupboard commands and the resulting JSONL files can be committed to git, confirming the create-and-commit workflow for agent task creation
    traces:
      - srd009-cupboard-cli AC3
      - srd002-sqlite-backend AC1
out_of_scope:
  - Properties (type, priority, labels, description) - see rel02.0
  - Issue-tracking CLI commands (ready, create, update, close) - see rel02.1-uc003
  - Trails and trail-scoped crumbs - see rel03.0
  - Epic and task hierarchy (child_of links) - see rel02.1-uc003
  - Comments and metadata - see rel02.1-uc004
  - Multi-agent coordination
test_suite: test-rel01.1
