id: rel03.0-uc003-stash-operations
title: Stash Operations
summary: |
  A developer creates stashes of each type (resource, artifact, context, counter,
  lock) to share state between crumbs. This tracer bullet validates stash creation,
  value operations (SetValue/GetValue), counter operations (Increment), lock
  operations (Acquire/Release with reentrant and contention semantics), version
  tracking across mutations, and fetch with filters through the Table interface.
actor: Coding agent or developer managing shared state between crumbs
trigger: Need to create, access, or coordinate shared state in a trail
flow:
  - F1: "Create cupboard and get stashes table: construct a Cupboard via sqlite.NewBackend(), call Attach(config), and get stashes table"
  - F2: "Create resource stash (requires table from F1): create a stash with type 'resource' containing URI and kind"
  - F3: "Verify resource stash creation (requires stash from F2): confirm StashID generated, Version is 1, CreatedAt set"
  - F4: "Create artifact stash (requires table from F1): create a stash with type 'artifact' containing path and producer"
  - F5: "Create context stash (requires table from F1): create a stash with type 'context' containing configuration data"
  - F6: "Test SetValue on context stash (requires context stash from F5): update value and verify Version increments"
  - F7: "Test GetValue retrieves current value (requires SetValue from F6): confirm value matches what was set"
  - F8: "Create counter stash (requires table from F1): create a stash with type 'counter' with initial value 0"
  - F9: "Test Increment with positive delta (requires counter from F8): call Increment(5), verify returns 5 and Version increments"
  - F10: "Test Increment with negative delta (requires accumulated value from F9): call Increment(-2), verify returns 3 and Version increments"
  - F11: "Test multiple increments (requires counter from F8): verify accumulated value is correct across operations"
  - F12: "Create lock stash (requires table from F1): create a stash with type 'lock' with nil initial value"
  - F13: "Test Acquire lock (requires lock from F12): call Acquire('worker-1'), verify success and Version increments"
  - F14: "Test reentrant acquire (requires held lock from F13): call Acquire('worker-1') again, verify success without error"
  - F15: "Test contention (requires held lock from F13): call Acquire('worker-2'), verify ErrLockHeld returned"
  - F16: "Test Release lock (requires held lock from F13): call Release('worker-1'), verify success and Version increments"
  - F17: "Test wrong holder release (requires released lock from F16): call Release('worker-2') on unlocked lock"
  - F18: "Fetch stashes by stash_type filter (requires stashes from F2-F12): query stashes table with stash_type filter"
  - F19: "Fetch stashes by name filter (requires stashes from F2-F12): query stashes table with name filter"
  - F20: "Delete stash (requires existing stash from F2): remove a stash and verify ErrNotFound on subsequent Get"
  - F21: "Query stash history after multiple mutations (requires mutations from F6-F16): call FetchStashHistory and verify all operations recorded"
  - F22: "Verify history entries (requires history from F21): confirm entries have correct version, operation, and value snapshots"
  - F23: "Detach the cupboard: call cupboard.Detach()"
touchpoints:
  - T1: "Cupboard interface: Attach, Detach, GetTable (srd001-cupboard-core R2)"
  - T2: "Table (stashes): Get, Set, Delete, Fetch (srd001-cupboard-core R3)"
  - T3: "Stash entity: StashID, Name, StashType, Value, Version, CreatedAt fields (srd008-stash-interface R1)"
  - T4: "Stash types: resource, artifact, context, counter, lock (srd008-stash-interface R2)"
  - T5: "SetValue/GetValue methods for value access (srd008-stash-interface R4)"
  - T6: "Increment method for counter operations (srd008-stash-interface R5)"
  - T7: "Acquire/Release methods for lock operations (srd008-stash-interface R6)"
  - T8: "Version tracking across mutations (srd008-stash-interface R1.6)"
  - T9: "Filter map for stash queries: stash_type, name (srd008-stash-interface R9)"
  - T10: "Stash history tracking: FetchStashHistory method (srd008-stash-interface R7)"
success_criteria:
  - id: S1
    criterion: All five stash types create and operate correctly through the Table interface; resource/artifact/context use SetValue/GetValue, counter uses Increment with positive and negative deltas, lock uses Acquire/Release with reentrant and contention semantics — confirming type-specific operations compose with the uniform storage layer
    traces:
      - srd008-stash-interface AC2
      - srd008-stash-interface AC3
      - srd008-stash-interface AC4
      - srd008-stash-interface AC5
  - id: S2
    criterion: Version tracking is consistent across all mutation types; Version starts at 1 and increments on every operation (create, set, increment, acquire, release), with FetchStashHistory returning entries for each mutation ordered by version ascending
    traces:
      - srd008-stash-interface AC1
      - srd008-stash-interface AC6
      - srd008-stash-interface AC7
  - id: S3
    criterion: Fetch with stash_type and name filters returns correct subsets, and delete removes stash with subsequent Get returning ErrNotFound — confirming query and lifecycle operations through the Table interface
    traces:
      - srd008-stash-interface AC10
      - srd008-stash-interface AC12
out_of_scope:
  - Stash scoping via scoped_to links (see rel03.0-uc002)
  - Blocking lock acquisition with timeout
  - Stash name uniqueness validation (backend may enforce)
  - Concurrent stash operations
test_suite: test-rel03.0
