id: rel03.0-uc001-trail-exploration
title: Trail-Based Exploration
summary: |
  A developer creates a trail to explore an implementation approach, adds crumbs
  to the trail via belongs_to links, and either completes or abandons the trail.
  This tracer bullet validates the trail lifecycle and the atomic cleanup behavior
  when abandoning exploratory work.
actor: Coding agent or developer exploring alternative implementation approaches
trigger: Uncertainty about the best approach to a task, requiring exploratory work that may be discarded
flow:
  - F1: "Create cupboard and get tables: construct a Cupboard via sqlite.NewBackend(), call Attach(config), and get trails, crumbs, and links tables"
  - F2: "Create a parent crumb (optional): create a task that the trail will explore approaches for"
  - F3: "Create a trail (requires tables from F1): call trailsTable.Set with a new Trail (defaults to draft state if no state specified)"
  - F4: "Transition trail to active (requires trail from F3): call trail.SetState('active') then Table.Set to start exploration"
  - F5: "Link branch point (optional, requires trail from F3 and crumb from F2): create a branches_from link to indicate the branch point"
  - F6: "Verify trail state and branch point (requires active trail from F4): retrieve the trail and confirm active state, query links table to verify the branches_from link"
  - F7: "Add exploration crumbs (requires active trail from F4): create crumbs and associate them with the trail via belongs_to links"
  - F8: "Add more crumbs to trail (repeats F7): repeat step F7 for additional exploration"
  - F9: "List crumbs on trail (requires links from F7-F8): query links table for belongs_to links where to_id equals the trail ID"
  - F10: "Remove a crumb from trail (requires linked crumb from F7): delete the belongs_to link to disassociate without deleting the crumb"
  - F11: "Abandon the trail (requires active trail with crumbs from F7-F8): call trail.Abandon() then Table.Set; backend deletes crumbs that belong to this trail but leaves removed crumbs intact"
  - F12: "Verify cleanup (requires abandonment from F11 and removal from F10): confirm deleted crumb returns ErrNotFound, removed crumb still exists"
  - F13: "Create another trail and complete it (separate path from F11): create trail, add crumbs, call trail.Complete() then Table.Set; backend removes belongs_to links and crumbs become permanent"
  - F14: "Verify completion (requires completion from F13): confirm completed trail crumbs still exist and are queryable"
  - F15: "Filter crumbs by trail (requires completion from F13): query links for completed trail returns empty (links removed on complete)"
  - F16: "Detach the cupboard: call cupboard.Detach()"
touchpoints:
  - T1: "Cupboard interface: Attach, Detach, GetTable (srd001-cupboard-core R2)"
  - T2: "Table (crumbs): Get, Set, Delete, Fetch (srd001-cupboard-core R3)"
  - T3: "Table (trails): Get, Set (srd001-cupboard-core R3)"
  - T4: "Table (links): Get, Set, Delete, Fetch with belongs_to/branches_from filters (srd007-links-interface R3, R4)"
  - T5: "Trail entity: Complete, Abandon, SetState methods (srd006-trails-interface R2, R5, R6)"
  - T6: "Trail creation via Table.Set (srd006-trails-interface R3); defaults to draft state"
  - T7: "Crumb-trail membership via belongs_to links (srd006-trails-interface R7)"
  - T8: "Trail completion makes crumbs permanent by removing links (srd006-trails-interface R5)"
  - T9: "Trail abandonment deletes associated crumbs atomically (srd006-trails-interface R6)"
  - T10: "Link-based querying for trail membership (srd002-sqlite-backend R12, R13)"
success_criteria:
  - id: S1
    criterion: Trail lifecycle completes with both outcomes; completion makes crumbs permanent by removing belongs_to links while crumbs persist, and abandonment deletes associated crumbs atomically — confirming the dual lifecycle paths work through the Table interface
    traces:
      - srd006-trails-interface AC5
      - srd006-trails-interface AC7
  - id: S2
    criterion: Crumbs removed from a trail before abandonment survive the cascade; only currently-linked crumbs are deleted, while previously disassociated crumbs remain — confirming selective cleanup based on link state
    traces:
      - srd006-trails-interface AC8
      - srd007-links-interface AC4
  - id: S3
    criterion: Link-based trail queries return correct membership; belongs_to filter on links table enumerates trail crumbs during active state, and completed trail query returns empty — confirming link lifecycle coupling with trail state
    traces:
      - srd007-links-interface AC5
      - srd006-trails-interface AC6
out_of_scope:
  - Nested trails (trails containing trails)
  - Trail merging or splitting
  - Trail history or versioning
  - Stash operations (see rel03.0-uc002 if created)
  - Concurrent trail operations
  - Trail templates or predefined workflows
test_suite: test-rel03.0
