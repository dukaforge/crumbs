id: rel03.0-uc001-trail-exploration
title: Trail-Based Exploration
summary: |
  A developer creates a trail to explore an implementation approach, adds crumbs
  to the trail via belongs_to links, and either completes or abandons the trail.
  This tracer bullet validates the trail lifecycle and the atomic cleanup behavior
  when abandoning exploratory work.
actor: Coding agent or developer exploring alternative implementation approaches
trigger: Uncertainty about the best approach to a task, requiring exploratory work that may be discarded
flow:
  - F1: "Create cupboard and get tables: construct a Cupboard via sqlite.NewBackend(), call Attach(config), and get trails, crumbs, and links tables"
  - F2: "Create a parent crumb (optional): create a task that the trail will explore approaches for"
  - F3: "Create a trail: call trailsTable.Set with a new Trail (defaults to draft state if no state specified)"
  - F4: "Transition trail to active: call trail.SetState('active') then Table.Set to start exploration"
  - F5: "Link branch point (optional): create a branches_from link to indicate the branch point"
  - F6: "Verify trail state and branch point: retrieve the trail and confirm active state, query links table to verify the branches_from link"
  - F7: "Add exploration crumbs: create crumbs and associate them with the trail via belongs_to links"
  - F8: "Add more crumbs to trail: repeat step F7 for additional exploration"
  - F9: "List crumbs on trail: query links table for belongs_to links where to_id equals the trail ID"
  - F10: "Remove a crumb from trail: delete the belongs_to link to disassociate without deleting the crumb"
  - F11: "Abandon the trail: call trail.Abandon() then Table.Set; backend deletes crumbs that belong to this trail but leaves removed crumbs intact"
  - F12: "Verify cleanup: confirm deleted crumb returns ErrNotFound, removed crumb still exists"
  - F13: "Create another trail and complete it: create trail, add crumbs, call trail.Complete() then Table.Set; backend removes belongs_to links and crumbs become permanent"
  - F14: "Verify completion: confirm completed trail crumbs still exist and are queryable"
  - F15: "Filter crumbs by trail: query links for completed trail returns empty (links removed on complete)"
  - F16: "Detach the cupboard: call cupboard.Detach()"
touchpoints:
  - T1: "Cupboard interface: Attach, Detach, GetTable (prd001-cupboard-core R2)"
  - T2: "Table (crumbs): Get, Set, Delete, Fetch (prd001-cupboard-core R3)"
  - T3: "Table (trails): Get, Set (prd001-cupboard-core R3)"
  - T4: "Table (links): Get, Set, Delete, Fetch with belongs_to/branches_from filters (prd007-links-interface R3, R4)"
  - T5: "Trail entity: Complete, Abandon, SetState methods (prd006-trails-interface R2, R5, R6)"
  - T6: "Trail creation via Table.Set (prd006-trails-interface R3); defaults to draft state"
  - T7: "Crumb-trail membership via belongs_to links (prd006-trails-interface R7)"
  - T8: "Trail completion makes crumbs permanent by removing links (prd006-trails-interface R5)"
  - T9: "Trail abandonment deletes associated crumbs atomically (prd006-trails-interface R6)"
  - T10: "Link-based querying for trail membership (prd002-sqlite-backend R12, R13)"
success_criteria:
  - S1: Trail created via Table.Set starts in draft state by default; can be transitioned to active via SetState
  - S2: belongs_to links associate crumbs with trails
  - S3: Querying links table with belongs_to filter returns crumbs on that trail
  - S4: Deleting belongs_to link disassociates without deleting the crumb
  - S5: trail.Abandon() then Table.Set deletes trail crumbs atomically
  - S6: Crumbs removed from trail before abandon survive
  - S7: trail.Complete() then Table.Set removes belongs_to links
  - S8: Completed trail crumbs remain queryable
  - S9: Trail state is completed or abandoned after respective operations
  - S10: No orphan crumbs or links after abandonment
out_of_scope:
  - Nested trails (trails containing trails)
  - Trail merging or splitting
  - Trail history or versioning
  - Stash operations (see rel03.0-uc002 if created)
  - Concurrent trail operations
  - Trail templates or predefined workflows
test_suite: test-rel03.0
