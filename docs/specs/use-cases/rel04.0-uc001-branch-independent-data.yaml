id: rel04.0-uc001-branch-independent-data
title: Branch-Independent Data Persistence
summary: |
  A developer working on a code feature branch uses cupboard to manage issues throughout.
  JSONL files are committed to main independent of the feature branch. Issue state is
  visible and consistent regardless of which branch the developer has checked out. Switching
  or abandoning a code branch does not affect issue state.

  This validates prd012-branch-independent-data: the data directory is a fixed path, JSONL
  lives on main, and issue lifecycle is decoupled from git branch lifecycle.
actor: Developer or coding agent working on a feature branch in a git repository with cupboard configured
trigger: Developer begins work on a code feature branch while issue tracking is active on main
flow:
  - F1: Developer is on main with JSONL files committed and cupboard configured
  - F2: Developer creates a new issue using cupboard; JSONL changes appear in the data directory
  - F3: Developer commits the JSONL changes to main (not to a feature branch)
  - F4: Developer creates and checks out a feature branch for code changes
  - F5: Developer runs cupboard commands from the feature branch; cupboard reads the same data directory
  - F6: Developer updates an issue status using cupboard from the feature branch
  - F7: Developer commits JSONL changes to main while still on the feature branch
  - F8: Developer switches back to main and verifies issue state is identical
  - F9: Developer abandons the feature branch without merging
  - F10: Developer verifies all issues are intact on main after branch abandonment
touchpoints:
  - T1: Data directory is a fixed path resolved from configuration, not from branch name (prd012-branch-independent-data R1.1, R1.2)
  - T2: JSONL files committed to main independent of feature branch (prd012-branch-independent-data R2.1, R2.2)
  - T3: Issue state visible from any branch via the data directory (prd012-branch-independent-data R2.3)
  - T4: Abandoning a code branch does not affect issue state (prd012-branch-independent-data R3.3)
  - T5: SQLite rebuilt from JSONL on Attach; cupboard.db gitignored (prd002-sqlite-backend R4, R1.1; prd012-branch-independent-data R1.4)
  - T6: Commit message references crumb IDs for traceability (prd012-branch-independent-data R4.1)
  - T7: Cupboard CLI resolves data directory from configuration (prd010-configuration-directories R1, R2)
success_criteria:
  - S1: cupboard create on main produces a crumb; JSONL file in data directory contains the new record
  - S2: git commit of JSONL to main succeeds; cupboard.db is not included in the commit
  - S3: git checkout -b feature-branch succeeds; cupboard list from feature branch returns the same issues as on main
  - S4: cupboard update on a feature branch changes issue state; JSONL updated in data directory
  - S5: git commit of JSONL to main from feature branch succeeds without merging code changes
  - S6: git checkout main shows issue state identical to what was committed from the feature branch
  - S7: git branch -D feature-branch (abandonment without merge) succeeds; all issues remain visible on main
  - S8: cupboard list after branch abandonment returns the same count and state as before abandonment
out_of_scope:
  - Conflict resolution if JSONL is modified on two branches simultaneously
  - CI/CD automation of JSONL commits to main
  - Remote synchronization or push behavior
  - Code branch naming conventions or worktree management
test_suite: test-rel04.0
