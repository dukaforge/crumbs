id: rel03.0-uc004-trail-crumb-lifecycle
title: Trail-Crumb Lifecycle Control
summary: 'A developer uses trails as containers to group crumbs and control their
  lifecycle.

  Crumbs belong to trails via belongs_to links. When a trail completes, its crumbs

  become permanent (links removed, crumbs persist). When a trail is abandoned, its

  crumbs are deleted atomically. This tracer bullet validates the lifecycle coupling

  between trails and their member crumbs, distinct from exploration branching.

  '
actor: Coding agent managing work items with lifecycle control
trigger: Need to group crumbs under a container that controls their permanence or
  deletion
flow:
  - F1: "Initialize cupboard: construct via sqlite.NewBackend(), call Attach(config), get trails, crumbs, and links tables"
  - F2: "Create a trail container (requires tables from F1): call trailsTable.Set with a new Trail in draft state"
  - F3: "Transition trail to active (requires trail from F2): call trail.SetState('active') then Table.Set to enable adding crumbs"
  - F4: "Create crumbs for the trail (requires tables from F1): create multiple crumbs via crumbsTable.Set"
  - F5: "Associate crumbs with trail (requires crumbs from F4 and active trail from F3): create belongs_to links from each crumb to the trail"
  - F6: "Query crumbs by trail membership (requires links from F5): Fetch links with belongs_to filter to find all crumbs in the trail"
  - F7: "Verify crumb accessibility (requires linked crumbs from F5): crumbs are retrievable and modifiable while trail is active"
  - F8: "Move crumb between trails (requires linked crumb from F5 and second trail): delete old belongs_to link, create new belongs_to link to different trail"
  - F9: "Complete the trail (requires active trail from F3 with crumbs): call trail.Complete() then trailsTable.Set; backend removes belongs_to links"
  - F10: "Verify crumbs are permanent (requires completion from F9): crumbs exist without belongs_to links, indistinguishable from never-trailed crumbs"
  - F11: "Create another trail for abandonment test (separate path from F9): create trail, add crumbs, link them"
  - F12: "Abandon the trail (requires active trail from F11): call trail.Abandon() then trailsTable.Set; backend deletes associated crumbs atomically"
  - F13: "Verify cascade deletion (requires abandonment from F12): crumbs return ErrNotFound, all related links deleted, properties cleaned up"
  - F14: "Detach the cupboard: call cupboard.Detach()"
touchpoints:
  - T1: "Cupboard interface: Attach, Detach, GetTable (srd001-cupboard-core R2)"
  - T2: "Table interface: Get, Set, Delete, Fetch (srd001-cupboard-core R3)"
  - T3: "Trail entity: SetState method for state transitions (srd006-trails-interface R2)"
  - T4: "Trail entity: Complete method marks crumbs permanent (srd006-trails-interface R5)"
  - T5: "Trail entity: Abandon method triggers cascade deletion (srd006-trails-interface R6)"
  - T6: "belongs_to links: crumb → trail membership (srd007-links-interface R2.1)"
  - T7: "Cardinality constraint: crumb belongs to at most one trail (srd007-links-interface R6.1)"
  - T8: "Backend cascade on complete: removes belongs_to links (srd006-trails-interface R5.6)"
  - T9: "Backend cascade on abandon: deletes crumbs, properties, links atomically (srd006-trails-interface R6.6, R6.7)"
success_criteria:
  - id: S1
    criterion: Trail completion makes crumbs permanent; Complete removes all belongs_to links but crumbs persist without trail association, indistinguishable from never-trailed crumbs — confirming the link-removal cascade on the completion path
    traces:
      - srd006-trails-interface AC5
      - srd006-trails-interface AC6
  - id: S2
    criterion: Trail abandonment deletes crumbs atomically; Abandon removes crumbs, their properties, metadata, and all links involving the crumb — confirming cascade deletion across multiple tables
    traces:
      - srd006-trails-interface AC7
      - srd006-trails-interface AC8
  - id: S3
    criterion: Crumb-trail cardinality is enforced; a crumb belongs to at most one trail, and crumbs can move between trails by deleting and recreating belongs_to links — confirming membership constraints through the links table
    traces:
      - srd007-links-interface AC8
      - srd006-trails-interface AC9
out_of_scope:
  - Trail branching via branches_from links (see rel03.0-uc001-trail-exploration)
  - Nested trails or trail hierarchies
  - Concurrent trail operations
  - Trail merging or splitting
  - Stash-trail scoping (see rel03.0-uc003-stash-operations)
test_suite: test-rel03.0
