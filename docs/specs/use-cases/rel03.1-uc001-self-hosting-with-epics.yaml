id: rel03.1-uc001-self-hosting-with-epics
title: Self-Hosting with Epics via Trails
summary: 'The cupboard CLI tracks development work on the crumbs repository using
  trails

  as epic equivalents. An agent creates a trail to group related tasks (crumbs),

  associates crumbs with the trail via belongs_to links, and uses trail lifecycle

  operations to control grouped work. Completing a trail finalizes all its tasks;

  abandoning a trail discards them. This validates full-featured self-hosting that

  replaces beads epics with cupboard trails.

  '
actor: Coding agent (e.g., Claude Code) working on the crumbs codebase via do-work.sh
  and make-work.sh scripts
trigger: Need to organize related tasks under an epic-like container with lifecycle
  control
flow:
  - F1: "Create an epic trail: run cupboard set trails '' '{\"State\":\"draft\"}' to create a trail that will group related tasks"
  - F2: "Transition trail to active (requires trail from F1): run cupboard set trails <trail_id> '{\"State\":\"active\"}'"
  - F3: "Create tasks for the epic (requires active trail from F2): run cupboard set crumbs '' '{\"Name\":\"Task 1\",\"State\":\"draft\"}' for each task"
  - F4: "Associate crumbs with trail (requires crumbs from F3 and trail from F1): run cupboard set links '' '{\"LinkType\":\"belongs_to\",\"FromID\":\"<crumb_id>\",\"ToID\":\"<trail_id>\"}'"
  - F5: "Query crumbs by epic (requires links from F4): run cupboard list links LinkType=belongs_to ToID=<trail_id>"
  - F6: "Work on tasks (requires linked crumbs from F4): pick a task, claim it (set State to taken), complete work, close it (set State to pebble)"
  - F7: "Add more tasks to epic during work (requires active trail from F2): create new crumbs and link them to the trail"
  - F8: "Complete the epic trail (requires active trail with tasks from F3-F6): run cupboard set trails <trail_id> '{\"State\":\"completed\"}'"
  - F9: "Verify crumbs are permanent (requires completion from F8): run cupboard list links LinkType=belongs_to ToID=<trail_id> returns empty"
  - F10: "Create another epic for abandonment scenario (separate path from F8): create trail, add crumbs, link them"
  - F11: "Abandon the failed epic (requires active trail from F10): run cupboard set trails <trail_id> '{\"State\":\"abandoned\"}'"
  - F12: "Verify cascade deletion (requires abandonment from F11): cupboard get crumbs <crumb_id> returns error for abandoned crumbs"
  - F13: "Integrate with do-work.sh (exercises F1-F8 in script context): script creates trail for related work, adds crumbs, completes trail on merge"
  - F14: "Integrate with make-work.sh (exercises F1-F4 in script context): script creates trails as epics and groups child tasks"
  - F15: "Commit JSONL files to git (after F13/F14 complete): per eng01-git-integration, all JSONL files are committed including trails and links"
touchpoints:
  - T1: "cupboard CLI (cmd/cupboard): generic table commands get, set, list, delete for trails, crumbs, and links"
  - T2: "Cupboard library (pkg/types): Cupboard interface with GetTable, Table interface for CRUD (srd001-cupboard-core R2, R3)"
  - T3: "Trail entity (pkg/types): State field, lifecycle transitions draft→active→completed/abandoned (srd006-trails-interface R2)"
  - T4: "Trail completion semantics: removes belongs_to links, crumbs become permanent (srd006-trails-interface R5)"
  - T5: "Trail abandonment semantics: deletes associated crumbs atomically (srd006-trails-interface R6)"
  - T6: "Links table: belongs_to links associate crumbs with trails (srd007-links-interface R2.1)"
  - T7: "SQLite backend (internal/sqlite): storage, JSONL persistence, cascade operations (srd002-sqlite-backend R1-R5)"
  - T8: "do-work.sh: optionally creates trail for grouped work, completes trail on merge"
  - T9: "make-work.sh: maps epics to trails, child tasks to belongs_to-linked crumbs"
  - T10: ".claude/rules/: agent workflow instructions referencing trail-based epic management"
success_criteria:
  - id: S1
    criterion: do-work.sh completes a full cycle with trail-based epic grouping; create trail, add crumbs via belongs_to links, work tasks through state transitions, complete trail to finalize — confirming trails serve as epic containers for agent workflows
    traces:
      - srd006-trails-interface AC3
      - srd006-trails-interface AC5
      - srd003-crumbs-interface AC3
  - id: S2
    criterion: make-work.sh creates epics as trails, groups child tasks via belongs_to links, and the resulting JSONL files (trails.jsonl, links.jsonl, crumbs.jsonl) can be committed to git — confirming the create-and-commit workflow extends to trail-based organization
    traces:
      - srd006-trails-interface AC3
      - srd002-sqlite-backend AC1
out_of_scope:
  - Nested trails (trails containing trails) - not supported per rel03.0-uc001
  - Trail merging or splitting
  - Concurrent trail operations
  - Multi-agent coordination (single agent self-hosting)
  - Remote backends (SQLite only)
  - Properties for trails (trail properties are future work per ARCHITECTURE)
test_suite: test-rel03.1
