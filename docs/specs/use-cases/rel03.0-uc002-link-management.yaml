id: rel03.0-uc002-link-management
title: Link Management
summary: |
  A developer creates links between entities to establish relationships: belongs_to
  (crumb→trail membership), child_of (crumb→crumb hierarchy), branches_from
  (trail→crumb branch point), and scoped_to (stash→trail scope). This tracer bullet
  validates link CRUD operations, uniqueness constraints, and filter-based queries
  through the Table interface.
actor: Coding agent or developer managing entity relationships
trigger: Need to establish, query, or remove relationships between crumbs, trails, and stashes
flow:
  - F1: "Create cupboard and get tables: construct a Cupboard via sqlite.NewBackend(), call Attach(config), and get links, crumbs, trails, and stashes tables"
  - F2: "Create prerequisite entities (requires tables from F1): create parent crumb, child crumb, trail, and stash for linking"
  - F3: "Create belongs_to link (requires crumb and trail from F2): create a link from crumb to trail indicating trail membership"
  - F4: "Verify belongs_to link (requires link from F3): retrieve the link and confirm link_type, from_id, and to_id"
  - F5: "Create child_of link (requires parent and child crumbs from F2): create a link from child crumb to parent crumb indicating hierarchy"
  - F6: "Verify child_of link (requires link from F5): retrieve the link and confirm the crumb dependency relationship"
  - F7: "Create branches_from link (requires trail and crumb from F2): create a link from trail to crumb indicating branch point"
  - F8: "Verify branches_from link (requires link from F7): retrieve the link and confirm the trail branch point"
  - F9: "Create scoped_to link (requires stash and trail from F2): create a link from stash to trail indicating trail scope"
  - F10: "Verify scoped_to link (requires link from F9): retrieve the link and confirm the stash scope"
  - F11: "Fetch links by link_type (requires links from F3-F9): query links table with link_type filter"
  - F12: "Fetch links by from_id (requires links from F3-F9): query links table with from_id filter"
  - F13: "Fetch links by to_id (requires links from F3-F9): query links table with to_id filter"
  - F14: "Fetch links with combined filters (requires links from F3-F9): query with multiple filter keys"
  - F15: "Update link (requires existing link from F3): Set with existing link ID updates fields"
  - F16: "Delete link (requires existing link from F3): remove a link and verify ErrNotFound on subsequent Get"
  - F17: "Delete nonexistent link (independent error path): verify ErrNotFound returned"
  - F18: "Verify uniqueness (requires existing link from F3): attempt duplicate link creation with same link_type+from_id+to_id"
  - F19: "Detach the cupboard: call cupboard.Detach()"
touchpoints:
  - T1: "Cupboard interface: Attach, Detach, GetTable (prd001-cupboard-core R2)"
  - T2: "Table (links): Get, Set, Delete, Fetch (prd007-links-interface R3, R4)"
  - T3: "Table (crumbs): Set for creating prerequisite crumbs (prd001-cupboard-core R3)"
  - T4: "Table (trails): Set for creating prerequisite trails (prd001-cupboard-core R3)"
  - T5: "Table (stashes): Set for creating prerequisite stashes (prd001-cupboard-core R3)"
  - T6: "Link entity: LinkID, LinkType, FromID, ToID, CreatedAt fields (prd002-sqlite-backend R14.6)"
  - T7: "belongs_to link type: crumb→trail membership (prd006-trails-interface R7)"
  - T8: "child_of link type: crumb→crumb hierarchy (prd007-links-interface R2.1)"
  - T9: "branches_from link type: trail→crumb branch point (prd006-trails-interface R9)"
  - T10: "scoped_to link type: stash→trail scope (prd008-stash-interface R13)"
  - T11: "Link table indexes: idx_links_type_from, idx_links_type_to (prd002-sqlite-backend R3.3)"
success_criteria:
  - id: S1
    criterion: All four link types (belongs_to, child_of, branches_from, scoped_to) create and retrieve correctly through the uniform Table interface, confirming that the links table handles all cross-entity relationship semantics
    traces:
      - prd007-links-interface AC2
      - prd007-links-interface AC4
  - id: S2
    criterion: Filter-based queries return correct subsets; link_type, from_id, and to_id filters narrow results independently, and combined filters AND correctly — confirming the filter map works across all link types
    traces:
      - prd007-links-interface AC5
      - prd007-links-interface AC6
  - id: S3
    criterion: Delete removes link permanently with subsequent Get returning ErrNotFound, and delete of nonexistent link also returns ErrNotFound — confirming link lifecycle consistency
    traces:
      - prd007-links-interface AC4
      - prd007-links-interface AC9
out_of_scope:
  - Trail cascade behavior on Complete/Abandon (see rel03.0-uc001)
  - Graph traversal or cycle detection (R10 ValidateDAG)
  - Foreign key validation (R10 ValidateReferences)
  - Link cardinality enforcement (one belongs_to per crumb, etc.)
  - Concurrent link operations
test_suite: test-rel03.0
