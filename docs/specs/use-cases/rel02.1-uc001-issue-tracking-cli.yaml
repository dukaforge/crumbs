id: rel02.1-uc001-issue-tracking-cli
title: Issue-Tracking CLI
summary: 'A user or agent runs the seven issue-tracking commands (create, ready,

  update, close, show, list, comments) against a fresh cupboard and verifies

  correct output in both human-readable and JSON formats.

  '
actor: Developer or coding agent using the cupboard CLI for task tracking
trigger: Invoking any of the issue-tracking commands from the terminal
flow:
  - F1: "Initialize cupboard: create config.yaml with SQLite backend and data_dir, set CUPBOARD_CONFIG"
  - F2: "Create task with required fields (requires initialized cupboard from F1): run cupboard create --type task --title --description"
  - F3: "Create task with JSON output (requires initialized cupboard from F1): run cupboard create with --json flag to capture the ID"
  - F4: "Create epic with labels (requires initialized cupboard from F1): run cupboard create --type epic --labels to set categorical and list properties"
  - F5: "List all crumbs (requires crumbs from F2-F4): run cupboard list --json to retrieve all crumbs via Table.Fetch(nil)"
  - F6: "Show specific crumb (requires crumb ID from F3): run cupboard show <id> to display details via Table.Get"
  - F7: "Find available work (requires crumbs from F2-F4): run cupboard ready --json --type task to fetch open tasks"
  - F8: "Claim task (requires task ID from F3): run cupboard update <id> --status in_progress to transition state"
  - F9: "Verify status change (requires update from F8): run cupboard show <id> to confirm state is in_progress"
  - F10: "Add comment (requires crumb ID from F3): run cupboard comments add <id> 'text' to append metadata"
  - F11: "Verify comment (requires comment from F10): run cupboard show <id> to confirm comment appears in output"
  - F12: "Close task (requires claimed task from F8): run cupboard close <id> to set state to closed"
  - F13: "Verify final state (requires close from F12): run cupboard show <id> to confirm state is closed"
  - F14: "Confirm ready excludes closed (requires closed task from F12): run cupboard ready --json --type task and verify closed task is absent"
touchpoints:
  - T1: "Cupboard interface: GetTable('crumbs') (prd001-cupboard-core R2)"
  - T2: "Table interface: Get, Set, Fetch (prd001-cupboard-core R3)"
  - T3: "cupboard CLI create command: creation via Table.Set (prd003-crumbs-interface R3)"
  - T4: "cupboard CLI ready command: Fetch with filter (prd003-crumbs-interface R9, R10)"
  - T5: "cupboard CLI update command: SetState (prd003-crumbs-interface R4)"
  - T6: "cupboard CLI close command: Pebble (prd003-crumbs-interface R4.3)"
  - T7: "cupboard CLI show command: Table.Get (prd001-cupboard-core R3.2)"
  - T8: "cupboard CLI list command: Table.Fetch (prd003-crumbs-interface R10)"
  - T9: "cupboard CLI comments add command: metadata (prd002-sqlite-backend R2.8)"
  - T10: "Crumb entity: state transitions, properties (prd003-crumbs-interface R2, R4, R5)"
  - T11: "Properties: type, priority, labels (prd004-properties-interface R9)"
  - T12: "SQLite backend: JSONL persistence (prd002-sqlite-backend R5)"
success_criteria:
  - id: S1
    criterion: Full issue lifecycle completes through CLI commands; create produces a crumb with properties, update transitions state, close marks as closed, and ready correctly excludes non-open tasks — confirming the seven issue-tracking commands compose into a working workflow
    traces:
      - prd009-cupboard-cli AC3
      - prd003-crumbs-interface AC3
      - prd003-crumbs-interface AC4
  - id: S2
    criterion: Comment-to-CLI pipeline works end-to-end; comments add appends metadata visible in show output, confirming the metadata system integrates with the issue-tracking CLI
    traces:
      - prd005-metadata-interface AC5
      - prd005-metadata-interface AC7
out_of_scope:
  - Script integration (do-work.sh, make-work.sh) covered by rel02.1-uc003-self-hosting Phase 2
  - Interactive agent workflow rules covered by rel02.1-uc003-self-hosting Phase 3
  - Trail operations (create, complete, abandon)
  - Multi-user or concurrent access patterns
  - Remote backends
test_suite: test-rel02.1
