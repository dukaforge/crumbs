id: rel01.0-uc003-crumb-lifecycle
title: Crumb Entity Operations
summary: |
  A developer creates crumbs and exercises the full crumb state machine,
  transitioning crumbs through draft to pending to ready to taken to pebble
  (success) and draft to dust (failure). This tracer bullet validates the
  Crumb entity methods (SetState, Pebble, Dust), timestamp behavior on state
  transitions, and state-based filtering. The focus is on crumbs-specific
  behavior, not on the generic Table interface (see rel01.0-uc002).
actor: Developer or agent managing work items
trigger: Need to verify that crumbs follow the documented state machine and that entity methods correctly modify state, update timestamps, and interact with Table persistence
flow:
  - F1: "Setup: attach a Cupboard with SQLite backend and obtain the crumbs table via cupboard.GetTable(crumbs)"
  - F2: "Create crumb in draft state (requires Table from F1): call table.Set with empty ID and a new Crumb; the backend generates a UUID v7 and initializes the crumb with State draft, CreatedAt, UpdatedAt, and an empty Properties map"
  - F3: "Verify initial state (requires crumb from F2): retrieve the crumb via table.Get(id); confirm State is draft, timestamps are set, and Properties is initialized"
  - F4: "Transition draft to pending (requires draft crumb from F3): call crumb.SetState(pending) then table.Set(id, crumb); retrieve and confirm State is pending and UpdatedAt has advanced"
  - F5: "Transition pending to ready (requires pending state from F4): call crumb.SetState(ready) then table.Set(id, crumb); retrieve and confirm State is ready"
  - F6: "Transition ready to taken (requires ready state from F5): call crumb.SetState(taken) then table.Set(id, crumb); retrieve and confirm State is taken"
  - F7: "Complete via Pebble (requires taken state from F6): call crumb.Pebble() then table.Set(id, crumb); retrieve and confirm State is pebble (terminal success); UpdatedAt must reflect the transition time"
  - F8: "Create a second crumb for the failure path: call table.Set with empty ID and a new Crumb; verify State is draft"
  - F9: "Fail via Dust (requires non-terminal crumb from F8): call crumb2.Dust() then table.Set(id2, crumb2); retrieve and confirm State is dust (terminal failure)"
  - F10: "Filter by state (requires crumbs in different states from F7 and F9): call table.Fetch with states filter for draft; verify the result excludes both the pebble crumb and the dust crumb"
  - F11: "Filter for terminal states (requires terminal crumbs from F7 and F9): call table.Fetch with states filter for pebble; verify only the completed crumb is returned; repeat for dust"
  - F12: "Create crumb and transition to dust from any non-terminal state: create a third crumb, transition to ready, then call Dust(); verify the crumb reaches dust regardless of its previous state"
  - F13: "Verify UpdatedAt tracks transitions (across all transitions in F4-F7): for each state transition confirm that UpdatedAt changed and is equal to or later than the previous value; CreatedAt must remain unchanged"
  - F14: "Detach (after all operations complete): call cupboard.Detach()"
touchpoints:
  - T1: "Table interface: Get, Set, Fetch for persistence and retrieval (srd001-cupboard-core R2)"
  - T2: "Crumb entity: SetState, Pebble, Dust methods (srd003-crumbs-interface R2)"
  - T3: "Crumb state machine: draft to pending to ready to taken to pebble; any to dust (srd003-crumbs-interface R2, R4, R5)"
  - T4: "Crumb creation defaults to draft state with initialized timestamps (srd003-crumbs-interface R1, R3)"
  - T5: "UpdatedAt advances on every state transition; CreatedAt remains constant (srd003-crumbs-interface R3)"
  - T6: "State-based Fetch filtering correctly includes and excludes crumbs by state (srd003-crumbs-interface R9, R10)"
success_criteria:
  - id: S1
    criterion: Full success path (draft to pending to ready to taken to pebble) and full failure path (draft to dust) both complete, with UpdatedAt advancing on each transition and CreatedAt remaining constant throughout
    traces:
      - srd003-crumbs-interface AC2
      - srd003-crumbs-interface AC3
      - srd003-crumbs-interface AC4
  - id: S2
    criterion: Dust() transitions a crumb to the dust terminal state from any non-terminal state (not only from draft), confirming the any-to-dust edge case in the state machine
    traces:
      - srd003-crumbs-interface AC3
      - srd003-crumbs-interface AC11
  - id: S3
    criterion: State-based Fetch filtering correctly partitions crumbs; filtering for a non-terminal state excludes pebble and dust crumbs, and filtering for pebble or dust returns only crumbs in that terminal state
    traces:
      - srd003-crumbs-interface AC12
      - srd003-crumbs-interface AC13
out_of_scope:
  - Generic Table CRUD operations (create, update, delete, fetch) — see rel01.0-uc002
  - Property operations (SetProperty, GetProperty, ClearProperty) — see rel02.0-uc001
  - Trail membership (belongs_to links) — see rel03.0-uc001
  - Crumb deletion (Table.Delete) — see rel01.0-uc002
  - Invalid state transition rejection (not enforced by the Table; agents define rules)
  - Concurrent state transitions
test_suite: test-rel01.0
