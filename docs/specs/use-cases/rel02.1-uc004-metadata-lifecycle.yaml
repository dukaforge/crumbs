id: rel02.1-uc004-metadata-lifecycle
title: Metadata Lifecycle Operations
summary: 'A developer attaches metadata to crumbs using the comments and attachments

  schemas, retrieves metadata by ID, queries metadata using filters, and

  verifies that metadata entries are removed when the parent crumb is deleted.

  This tracer bullet validates the append-only metadata pattern where multiple

  entries accumulate on a single crumb, and the cascade delete behavior that

  maintains referential integrity.

  '
actor: Developer or agent working through the Cupboard API
trigger: Need to attach supplementary information to crumbs (comments, attachments) and verify metadata lifecycle behavior
flow:
  - F1: "Attach backend: construct a Cupboard, call Attach(config) with a SQLite backend configuration; the backend creates DataDir and initializes the metadata table with built-in schemas"
  - F2: "Create a crumb (requires attached backend from F1): call table.Set on the crumbs table with an empty ID to create a crumb that will hold metadata"
  - F3: "Add a comment (requires crumb from F2): construct a Metadata struct with TableName=comments and Content=text, call table.Set on the metadata table with empty ID; the backend generates a UUID v7 and persists the entry"
  - F4: "Add a second comment (requires crumb from F2, tests accumulation after F3): call table.Set again with different content; verify that multiple metadata entries accumulate for the same crumb"
  - F5: "Add an attachment (requires crumb from F2): construct a Metadata struct with TableName=attachments and Content=JSON object, call table.Set; the backend stores the JSON content as-is"
  - F6: "Retrieve metadata by ID (requires metadata ID from F3): call table.Get with the metadata ID; the backend returns the Metadata struct with all fields populated"
  - F7: "Filter by schema (requires entries from F3-F5): call table.Fetch with filter schema=comments; the result includes only comment entries"
  - F8: "Filter by crumb_id (requires entries from F3-F5): call table.Fetch with filter crumb_id=crumb-uuid; the result includes only entries for that crumb"
  - F9: "Combine filters (requires entries from F3-F5): call table.Fetch with both schema and crumb_id filters; verify that filters are ANDed"
  - F10: "Verify ErrNotFound (independent error path): call table.Get with a nonexistent metadata ID; the operation returns ErrNotFound"
  - F11: "Verify ErrInvalidID (independent error path): call table.Get with an empty ID; the operation returns ErrInvalidID"
  - F12: "Delete the parent crumb (requires crumb with metadata from F2-F5): call table.Delete on the crumbs table for the crumb with metadata"
  - F13: "Verify cascade delete (requires deletion from F12): call table.Fetch with crumb_id filter for the deleted crumb; the result is empty, confirming all metadata was removed"
  - F14: "Detach: call cupboard.Detach() to release resources"
touchpoints:
  - T1: "Cupboard interface: Attach, GetTable, Detach (prd001-cupboard-core R2)"
  - T2: "Table interface: Get, Set, Delete, Fetch (prd001-cupboard-core R3)"
  - T3: "Metadata struct: MetadataID, CrumbID, TableName, Content, PropertyID, CreatedAt (prd005-metadata-interface R1)"
  - T4: "Built-in schemas: comments (text), attachments (json) (prd005-metadata-interface R3)"
  - T5: "Metadata creation via Table.Set: UUID v7 generation, timestamp (prd005-metadata-interface R4)"
  - T6: "Metadata retrieval via Table.Get: type assertion to *Metadata (prd005-metadata-interface R5)"
  - T7: "Filter map: schema, crumb_id filters (prd005-metadata-interface R7)"
  - T8: "Cascade delete: metadata removed when crumb deleted (prd005-metadata-interface R6.5)"
  - T9: "Error types: ErrNotFound, ErrInvalidID (prd005-metadata-interface R10)"
success_criteria:
  - id: S1
    criterion: Additive metadata accumulation and filter composition work end-to-end; multiple comments and attachments accumulate on a crumb, schema and crumb_id filters return correct subsets, and combined filters AND correctly — confirming the append-only pattern and query system integrate across the metadata table
    traces:
      - prd005-metadata-interface AC5
      - prd005-metadata-interface AC7
      - prd005-metadata-interface AC9
  - id: S2
    criterion: Cascade delete maintains referential integrity; deleting a crumb removes all its metadata entries, and subsequent Fetch with crumb_id filter returns empty — confirming cross-table lifecycle coupling between crumbs and metadata
    traces:
      - prd005-metadata-interface AC7
      - prd003-crumbs-interface AC10
out_of_scope:
  - Schema registration for custom metadata types (see prd005-metadata-interface R9)
  - PropertyID linking for property-specific metadata
  - Content validation (content_contains filter, JSON validation)
  - Limit and offset pagination
  - Metadata deletion via Table.Delete (append-only convention)
  - JSONL persistence verification (covered by rel01.0-uc002)
test_suite: test-rel02.1
