id: rel01.0-uc002-table-crud
title: Table Interface CRUD Operations
summary: |
  A developer attaches a SQLite backend, obtains a Table reference, and
  exercises the four uniform Table operations (Get, Set, Delete, Fetch) to
  create, retrieve, update, and remove entities. This tracer bullet validates
  the ORM-style pattern where callers create entity structs, persist them
  through Table.Set, retrieve them with Table.Get, query with Table.Fetch, and
  remove with Table.Delete. The focus is on the Table interface contract, not
  on any entity-specific behavior.
actor: Developer or agent working through the Cupboard API
trigger: Need to verify that the Table interface provides correct CRUD behavior across all standard tables with JSONL persistence and UUID v7 generation
flow:
  - F1: "Attach backend: construct a Cupboard, call Attach(config) with a SQLite backend configuration; the backend creates DataDir, initializes JSONL files, creates cupboard.db, and seeds built-in data"
  - F2: "Get a table (requires attached Cupboard from F1): call cupboard.GetTable(crumbs) to obtain a Table; the returned Table provides Get, Set, Delete, and Fetch operations"
  - F3: "Create an entity via Set with empty ID (requires Table from F2): construct a Crumb struct and call table.Set with empty ID; the backend generates a UUID v7, initializes timestamps, inserts into SQLite, and persists to JSONL"
  - F4: "Retrieve the entity via Get (requires ID from F3): call table.Get(id) with the generated ID; the backend queries SQLite, hydrates the row into the entity struct, and returns it"
  - F5: "Verify round-trip fidelity (requires entities from F3 and F4): compare the retrieved entity fields against what was created; CrumbID, Name, State, CreatedAt, and UpdatedAt must match"
  - F6: "Update the entity via Set with existing ID (requires entity from F4): modify a field on the struct and call table.Set(id, crumb); the backend updates the SQLite row and writes the change to JSONL"
  - F7: "Verify the update persists (requires update from F6): call table.Get(id) again; the modified field must reflect the change; UpdatedAt must be equal to or later than the previous value"
  - F8: "Create a second entity: call table.Set with empty ID to create another entity; the generated ID must differ from the first"
  - F9: "Fetch all entities (requires entities from F3 and F8): call table.Fetch with an empty filter; the result must contain both entities"
  - F10: "Fetch with filter (requires entities in different states): call table.Fetch with a state filter; the result must include only entities matching the filter"
  - F11: "Delete an entity (requires entity from F3): call table.Delete(id); the backend removes the entity from SQLite and JSONL; a subsequent Get returns an error"
  - F12: "Get nonexistent entity: call table.Get with a nonexistent ID; the operation must return an error indicating the entity was not found"
  - F13: "Delete nonexistent entity: call table.Delete with a nonexistent ID; the operation must return an error"
  - F14: "Verify JSONL persistence (requires write operations from F3, F6, F11): inspect the JSONL file to confirm that create, update, and delete operations are reflected; each line is valid JSON"
  - F15: "Repeat on every standard table (same contract as F3-F13): for each of trails, properties, metadata, links, and stashes, call cupboard.GetTable(name), create an entity with Set (empty ID), retrieve it with Get, list with Fetch, and delete with Delete; the same Table interface contract holds across all six standard tables"
  - F16: "Detach (after all operations complete): call cupboard.Detach() to release resources; subsequent Table operations return ErrCupboardDetached"
touchpoints:
  - T1: "Cupboard interface: Attach, GetTable, Detach (srd001-cupboard-core R2)"
  - T2: "Table interface: Get, Set, Delete, Fetch (srd001-cupboard-core R2)"
  - T3: "SQLite backend: UUID v7 generation, hydration, dehydration, JSONL persistence (srd002-sqlite-backend R5, R14)"
  - T4: "Table.Set with empty ID generates UUID v7 and creates entity (srd002-sqlite-backend R5)"
  - T5: "Table.Get retrieves and hydrates entity from SQLite (srd002-sqlite-backend R14)"
  - T6: "Table.Fetch returns matching entities; empty filter returns all (srd001-cupboard-core R2)"
  - T7: "Table.Delete removes entity from SQLite and JSONL (srd002-sqlite-backend R5)"
  - T8: "JSONL files are human-readable and reflect all write operations (srd002-sqlite-backend R5, R16)"
success_criteria:
  - id: S1
    criterion: Full CRUD round-trip completes; Set with empty ID creates an entity with UUID v7, Get retrieves it with all fields matching, Set with existing ID updates it, Get confirms the change, Delete removes it, and subsequent Get returns ErrNotFound
    traces:
      - srd001-cupboard-core AC3
      - srd002-sqlite-backend AC1
      - srd002-sqlite-backend AC4
  - id: S2
    criterion: The same CRUD operations (Set, Get, Fetch, Delete) work identically on all six standard tables (crumbs, trails, properties, metadata, links, stashes); the Table interface contract is uniform across entity types
    traces:
      - srd001-cupboard-core AC3
      - srd001-cupboard-core AC4
      - srd002-sqlite-backend AC11
  - id: S3
    criterion: JSONL persistence reflects all write operations; create, update, and delete are visible in the JSONL file as valid JSON lines, confirming the cross-layer path from Table interface through SQLite to JSONL
    traces:
      - srd002-sqlite-backend AC1
      - srd002-sqlite-backend AC4
out_of_scope:
  - Crumb state machine transitions (SetState, Pebble, Dust) — see rel01.0-uc003
  - Entity method behavior beyond field assignment — see rel01.0-uc003
  - Property operations (SetProperty, GetProperty, ClearProperty) — see rel02.0-uc001
  - Trail lifecycle (Complete, Abandon, cascade behavior) — see rel03.0-uc001
  - Concurrent access patterns
  - Error recovery (corrupt JSONL, I/O failures)
test_suite: test-rel01.0
