id: "srd004-properties-interface"
title: Properties Interface
implemented_by:
  - Entity Types
problem: |
  Applications need extensible attributes on crumbs beyond the core fields (name, state, timestamps). A task tracker might need priority, labels, and owner; a bug tracker might need severity and component. Hardcoding these fields into the Crumb struct creates rigid schemas that require code changes and migrations for every new attribute.

  We need a property system where applications can define custom attributes at runtime. Properties are metadata definitions (name, type, description) that can then be assigned values on individual crumbs. This separates schema (what properties exist) from data (what values crumbs have), enabling flexibility without migrations.

  This SRD defines the Property and Category entities: their struct fields and entity methods. Properties and categories are stored and retrieved via the generic Table interface from srd001-cupboard-core. Setting and getting property values on crumbs is handled by Crumb entity methods (see srd003-crumbs-interface); this SRD covers only the property definitions themselves.

  Future scope: VISION.md establishes that properties are a general mechanism extending crumbs, trails, and stashes uniformly. This SRD specifies crumb properties for the current release. Trail properties (e.g., hypothesis, approach, risk-level for exploration sessions) and stash properties (e.g., build-stage, artifact-type, retention-policy for shared state) will follow the same pattern in later releases.
goals:
- G1: Define the Property struct with all required fields
- G2: Define the Category struct for categorical properties
- G3: Define value types and their meaning
- G4: Specify entity method DefineCategory for creating categories on a property
- G5: "Specify how properties are created, retrieved, and queried via the Table interface"
- G6: "Document built-in properties seeded on first startup"
- G7: Document error conditions for all operations
requirements:
  D:
    title: Design Decisions
    items:
    - R0.1:
        text: "Property creation (Table.Set with empty ID) wraps the entire operation in a single SQLite transaction: (1)\
          \ INSERT the property row, (2) SELECT all existing crumb IDs, (3) INSERT one crumb_properties row per crumb using\
          \ the property's type-based default value. If any step fails, the transaction rolls back. The caller receives an\
          \ error and no property is created. This transaction is the only place in the system where a single write touches\
          \ both the properties table and the crumb_properties table simultaneously."
        weight: 1
  R1:
    title: Property Struct
    items:
    - R1.1:
        text: The Property struct must include the following fields
        weight: 1
    - R1.2:
        text: "PropertyID must be a UUID v7 (time-ordered) generated by the backend when Table.Set is called with an empty\
          \ id parameter"
        weight: 1
    - R1.3:
        text: Name must be unique across all properties. Table.Set must reject duplicate names with ErrDuplicateName
        weight: 1
    - R1.4:
        text: "Name must be non-empty. Table.Set must reject empty names with ErrInvalidName"
        weight: 1
    - R1.5:
        text: Description may be empty
        weight: 1
  R2:
    title: Category Struct
    items:
    - R2.1:
        text: The Category struct must include the following fields
        weight: 1
    - R2.2:
        text: "CategoryID must be a UUID v7 (time-ordered) generated by the backend when Table.Set is called with an empty\
          \ id parameter"
        weight: 1
    - R2.3:
        text: "Categories enable ordered enumeration for categorical properties. When a crumb has a categorical property value,\
          \ the value is a CategoryID"
        weight: 1
    - R2.4:
        text: Name must be unique within a property. Table.Set must reject duplicate names for the same property with ErrDuplicateName
        weight: 1
    - R2.5:
        text: Ordinal determines display order. Categories with lower ordinals appear first. Multiple categories may share
          the same ordinal (ties broken by name)
        weight: 1
  R3:
    title: Value Types
    items:
    - R3.1:
        text: A property must have exactly one of the following value types
        weight: 1
    - R3.2:
        text: "ValueType is stored as a string, not an enum, for JSON compatibility"
        weight: 1
    - R3.3:
        text: "Crumb.SetProperty validates that values match the property's ValueType (see srd003-crumbs-interface R5)"
        weight: 1
    - R3.4:
        text: "For categorical properties, values must be valid CategoryIDs defined for that property"
        weight: 1
    - R3.5:
        text: Each value type has a default value used when initializing properties on crumbs
        weight: 1
    - R3.6:
        text: "Default values ensure every crumb has a value for every defined property. There is no concept of a property\
          \ being \"not set\" on a crumb"
        weight: 1
  R4:
    title: Creating Properties
    items:
    - R4.1:
        text: "To create a new property, the caller constructs a Property struct and passes it to Table.Set"
        weight: 1
    - R4.2:
        text: "When Table.Set is called with an empty id parameter, the backend must generate a UUID v7 for PropertyID, set\
          \ CreatedAt to the current time, validate that Name is non-empty (ErrInvalidName if empty), validate that Name is\
          \ unique (ErrDuplicateName if exists), validate that ValueType is one of the valid types in R3.1 (ErrInvalidValueType\
          \ if not), and initialize the property on all existing crumbs with the type's default value (see R3.5)"
        weight: 2
    - R4.3:
        text: "The backfill algorithm must: (1) open a write transaction, (2) insert the new property row, (3) select all\
          \ crumb IDs from the crumbs table within the same transaction, (4) for each crumb ID insert a crumb_properties row\
          \ with the property's default value, (5) commit. If any step raises an error, roll back and return the error."
        weight: 5
    - R4.4:
        text: The backfill SELECT in step 3 must use the same transaction as the INSERT in step 2. This prevents a race where
          a crumb is created after the SELECT but before the commit (the newly created crumb will receive the property default
          via the crumb creation path in srd003 R3.2).
        weight: 5
    - R4.5:
        text: "Property initialization on existing crumbs (backfill) is atomic with property creation. If backfill fails,\
          \ the property is not created"
        weight: 5
    - R4.6:
        text: "Table.Set returns the generated PropertyID and any error. After successful creation, the Property struct is\
          \ updated with the generated PropertyID and CreatedAt timestamp"
        weight: 1
    - R4.7:
        text: Table.Set must persist the property before returning
        weight: 2
  R5:
    title: Retrieving Properties
    items:
    - R5.1:
        text: "To retrieve a property by ID, use Table.Get"
        weight: 1
    - R5.2:
        text: "Table.Get returns the entity as any; the caller must type-assert to *Property"
        weight: 1
    - R5.3:
        text: Table.Get returns ErrNotFound if no property exists with the given ID
        weight: 1
    - R5.4:
        text: Table.Get returns ErrInvalidID if id is empty
        weight: 1
  R6:
    title: Querying Properties
    items:
    - R6.1:
        text: "To retrieve all properties, use Table.Fetch with an empty filter"
        weight: 1
    - R6.2:
        text: "Table.Fetch returns a slice of entities ([]any); the caller must type-assert each element to *Property"
        weight: 1
    - R6.3:
        text: Table.Fetch returns an empty slice (not nil) if no properties exist
        weight: 1
    - R6.4:
        text: "Results are ordered by CreatedAt ascending (oldest first, built-ins first)"
        weight: 1
  R7:
    title: DefineCategory Entity Method
    items:
    - R7.1:
        text: DefineCategory is an entity method on Property that creates a new category
        weight: 1
    - R7.2:
        text: "DefineCategory must validate that the property's ValueType is \"categorical\" (ErrInvalidValueType if not)"
        weight: 2
    - R7.3:
        text: "DefineCategory must validate that name is non-empty (ErrInvalidName if empty)"
        weight: 2
    - R7.4:
        text: DefineCategory must validate that name is unique within the property (ErrDuplicateName if exists)
        weight: 2
    - R7.5:
        text: "DefineCategory must create a Category struct with a UUID v7 for CategoryID (generated by the backend), PropertyID\
          \ set to the property's ID, and the provided name and ordinal"
        weight: 2
    - R7.6:
        text: "DefineCategory must persist the category to backend storage. The backend manages category storage internally\
          \ (e.g., SQLite backend uses categories.jsonl)"
        weight: 3
    - R7.7:
        text: DefineCategory must return the created Category with all fields populated
        weight: 1
    - R7.8:
        text: Ordinal may be any integer. Negative ordinals are allowed
        weight: 1
    - R7.9:
        text: DefineCategory requires the Cupboard reference to access backend storage for categories
        weight: 1
  R8:
    title: GetCategories Entity Method
    items:
    - R8.1:
        text: GetCategories is an entity method on Property that retrieves all categories for the property
        weight: 2
    - R8.2:
        text: "GetCategories must validate that the property's ValueType is \"categorical\" (ErrInvalidValueType if not)"
        weight: 2
    - R8.3:
        text: GetCategories must query backend storage for categories with a filter for PropertyID
        weight: 1
    - R8.4:
        text: "GetCategories must return categories ordered by ordinal ascending, then name ascending for ties"
        weight: 1
    - R8.5:
        text: GetCategories must return an empty slice (not nil) if no categories are defined for the property
        weight: 1
    - R8.6:
        text: GetCategories requires the Cupboard reference to access backend storage for categories
        weight: 1
  R9:
    title: "Built-in Properties"
    items:
    - R9.1:
        text: "On first startup (when properties storage is empty), the backend must seed the following built-in properties"
        weight: 5
    - R9.2:
        text: "Built-in categories for \"priority\" property"
        weight: 1
    - R9.3:
        text: "Built-in categories for \"type\" property"
        weight: 1
    - R9.4:
        text: Seeding only occurs when the properties storage is empty (first run). Existing data is never modified by seeding
        weight: 1
    - R9.5:
        text: "Built-in properties can be extended (new categories added) but not deleted or renamed"
        weight: 1
    - R9.6:
        text: "Applications may define additional properties beyond the built-ins"
        weight: 1
  R10:
    title: Error Types
    items:
    - R10.1:
        text: Property and Category operations must return the following sentinel errors
        weight: 2
    - R10.2:
        text: All errors must be checkable with errors.Is
        weight: 1
package_contract:
  exports:
  - name: Property
    signature: "type Property struct { PropertyID string; Name string; Description string; ValueType string; CreatedAt time.Time\
      \ }"
  - name: Category
    signature: "type Category struct { CategoryID string; PropertyID string; Name string; Ordinal int }"
  - name: Property.DefineCategory
    signature: "func (p *Property) DefineCategory(name string, ordinal int) (*Category, error)"
  import_constraints:
  - pkg/schema must not import pkg/api or internal/
non_goals:
- "This SRD does not define setting or getting property values on crumbs. See srd003-crumbs-interface for SetProperty, GetProperty,\
  \ GetProperties, and ClearProperty"
- This SRD does not define property deletion. Properties are permanent once defined. Applications can stop using a property
  but cannot remove its definition
- "This SRD does not define property modification (renaming, changing type). Properties are immutable after creation"
- This SRD does not define property inheritance or computed properties
- "This SRD does not define validation rules beyond type checking (e.g., regex patterns, min/max values)"
- "This SRD does not define a specialized PropertyTable interface. Properties and categories are accessed via the standard\
  \ Table interface from srd001-cupboard-core"
- "This SRD does not define incremental or resumable backfill. If the process crashes during backfill, the next Attach reloads\
  \ from JSONL (source of truth) and the rollback ensures JSONL reflects only committed state"
