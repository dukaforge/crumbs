id: "srd010-configuration-directories"
title: Configuration Directory Structure
used_by:
  - Cupboard and Config
problem: |
  The Cupboard CLI needs two distinct directory locations: one for application settings (backend selection, defaults) and one for backend data (crumbs, trails, links). These serve different purposes and have different lifecycles. Configuration is set once and rarely changes; data changes constantly. Separating them clarifies what to version-control versus what to treat as runtime state, and simplifies backup strategies.

  Data files need a format suited to append-heavy workloads. JSONL (one JSON object per line) allows appending without rewriting, supports streaming reads, tolerates partial corruption (only the affected line is lost), and works with standard line-oriented tools (grep, head, tail). These properties also make JSONL files easy to merge in version control.

  Both directories default to the current working directory so that each project gets its own configuration and data without global state.
goals:
- G1: Define a CLI configuration directory separate from backend data
- G2: Define the backend data directory structure for SQLite backend
- G3: "Specify JSONL (line-delimited JSON) as the file format for data tables"
- G4: "Establish working-directory-local defaults for both directories"
- G5: Clarify the relationship between configuration and the Cupboard interface
requirements:
  R1:
    title: CLI Configuration Directory
    items:
    - R1.1:
        text: "The CLI configuration directory holds application-level settings, not backend data"
        weight: 1
    - R1.2:
        text: "The default configuration directory is `$(CWD)/.crumbs`"
        weight: 1
    - R1.3:
        text: "The configuration directory can be overridden with the `--config-dir` CLI flag"
        weight: 1
    - R1.4:
        text: "The CLI configuration directory must contain config.yaml for CLI settings (default backend, optional data directory\
          \ path, backend-specific options)"
        weight: 1
    - R1.5:
        text: config.yaml format must follow this structure
        weight: 1
    - R1.6:
        text: "If the configuration directory does not exist, the CLI must create it on first run with a default config.yaml"
        weight: 2
    - R1.7:
        text: The data_dir field is not set in config.yaml by default. The CLI writes it to config.yaml once it resolves the
          data directory location
        weight: 1
  R2:
    title: Backend Data Directory
    items:
    - R2.1:
        text: The backend data directory holds all data managed by a Cupboard backend. It is separate from CLI configuration
        weight: 1
    - R2.2:
        text: "The default data directory is `$(CWD)/.crumbs-db`"
        weight: 1
    - R2.3:
        text: The data directory can be overridden via the following mechanisms
        weight: 1
    - R2.4:
        text: The data directory path is passed to Cupboard via Config.DataDir when calling Attach
        weight: 1
    - R2.5:
        text: "If the data directory does not exist, the backend must create it during Attach"
        weight: 2
  R3:
    title: JSONL File Format
    items:
    - R3.1:
        text: The SQLite backend must use JSONL (JSON Lines) format for data files. Each table in the application has one
          JSONL file
        weight: 1
    - R3.2:
        text: "JSONL format rules: each line is a complete, valid JSON object; lines are separated by newline (\\n); no commas\
          \ between lines; no enclosing array brackets; empty lines are ignored; UTF-8 encoding required"
        weight: 1
    - R3.3:
        text: Example crumbs.jsonl format
        weight: 1
    - R3.4:
        text: "JSONL files must not be pretty-printed. Each record is a single line (no internal newlines in the JSON)"
        weight: 1
  R4:
    title: Data Directory File Layout
    items:
    - R4.1:
        text: The SQLite backend data directory must contain one JSONL file per table
        weight: 1
    - R4.2:
        text: "File naming convention: `{table_name}.jsonl` (lowercase, underscores for multi-word names)"
        weight: 1
    - R4.3:
        text: "If a JSONL file does not exist, the backend must create an empty file (zero bytes, not an empty array)"
        weight: 2
    - R4.4:
        text: The SQLite database (cupboard.db) is an ephemeral runtime cache. It is not part of the persistent file layout
          and must not be committed to version control
        weight: 1
  R5:
    title: Startup Sequence
    items:
    - R5.1:
        text: "On Attach with SQLite backend: create data directory if it does not exist; create empty JSONL files if they\
          \ do not exist; if cupboard.db exists, log a warning and delete it (indicates a previous unclean shutdown); create\
          \ new cupboard.db with schema; load each JSONL file into corresponding SQLite table (line by line); skip empty lines\
          \ and log warnings for malformed lines; validate foreign key relationships; return ready Cupboard instance"
        weight: 1
    - R5.2:
        text: "If a line in a JSONL file is malformed, the backend must log a warning with the file name, line number, and\
          \ error, then skip that line. The startup continues with remaining valid records"
        weight: 1
    - R5.3:
        text: "If foreign key validation fails, the backend must return an error listing the invalid references"
        weight: 2
  R6:
    title: Write Operations
    items:
    - R6.1:
        text: "Write operations persist to JSONL according to the sync strategy defined in srd002-sqlite-backend R16 (immediate,\
          \ on_close, or batch)"
        weight: 3
    - R6.2:
        text: "For updates and deletes, the backend must rewrite the entire JSONL file (read all, modify, write atomically).\
          \ This is acceptable because JSONL files are small enough to fit in memory for typical workloads"
        weight: 1
    - R6.3:
        text: "For append-only tables (stash_history), the backend may append a new line instead of rewriting"
        weight: 1
    - R6.4:
        text: "Atomic write pattern: write to temporary file ({filename}.tmp); sync to disk (fsync); rename temporary file\
          \ to target (atomic on POSIX)"
        weight: 5
  R7:
    title: Shutdown Sequence
    items:
    - R7.1:
        text: "On Detach: persist any pending JSONL writes per the sync strategy; delete cupboard.db; release all resources"
        weight: 3
    - R7.2:
        text: "After orderly shutdown, only JSONL files remain in the data directory. No cupboard.db"
        weight: 1
    - R7.3:
        text: "If the process terminates without Detach, cupboard.db may remain. The next startup handles this per R5.1"
        weight: 1
  R8:
    title: CLI Configuration Loading
    items:
    - R8.1:
        text: "On CLI startup: determine configuration directory (--config-dir flag or default); load config.yaml if it exists,\
          \ use defaults otherwise; determine data directory (--data-dir flag > data_dir in config.yaml > default); pass data\
          \ directory to Cupboard via Config.DataDir"
        weight: 1
    - R8.2:
        text: The CLI must not require config.yaml to exist. Missing config.yaml uses all defaults
        weight: 1
    - R8.3:
        text: The CLI must create config.yaml on first run with default settings
        weight: 2
  R9:
    title: Config Struct
    items:
    - R9.1:
        text: The Config struct must include Backend and DataDir
        weight: 1
    - R9.2:
        text: DataDir holds the directory for the SQLite backend
        weight: 1
    - R9.3:
        text: CLI configuration (config.yaml) is outside the Cupboard interface. The CLI reads config.yaml and constructs
          a Config struct to pass to Attach
        weight: 1
package_contract:
  exports:
  - name: ResolveConfigDir
    signature: "func ResolveConfigDir(flagValue string) (string, error)"
  - name: LoadConfig
    signature: "func LoadConfig(configDir string) (api.Config, error)"
  - name: DefaultConfigDir
    signature: "func DefaultConfigDir() (string, error)"
  import_constraints:
  - "Configuration resolution may import pkg/api for Config struct"
  - "Must not import internal/ packages"

non_goals:
- This SRD does not define configuration file encryption or secrets management.
- "This SRD does not define multi-workspace support (multiple data directories). One CLI instance operates on one data directory\
  \ at a time."
- "This SRD does not define network-based configuration (e.g., fetching config from a server)."
- This SRD does not define Windows support.
