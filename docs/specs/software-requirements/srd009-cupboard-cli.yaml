id: "srd009-cupboard-cli"
title: Cupboard CLI Interface
used_by:
  - Cupboard and Config
problem: |
  The CLI design is scattered across multiple documents. srd001-cupboard-core defines the Cupboard and Table interfaces but does not specify CLI commands. srd010-configuration-directories defines configuration flags but not command structure. srd003-crumbs-interface defines the Crumb entity but not crumb-specific CLI commands. eng02-beads-migration lists issue-tracking commands but not their full specification.

  Agents building the CLI must read four documents and infer the CLI contract. Without a single specification, implementations diverge on command naming, flag conventions, output formats, and error handling. We need one document that defines the complete CLI interface so developers and agents can implement commands consistently.
goals:
- G1: Consolidate all CLI commands into one specification
- G2: Define generic table commands that expose the Table interface
- G3: "Define crumb-specific commands with entity-aware flags"
- G4: "Define issue-tracking commands for the beads migration"
- G5: "Specify output formats for human-readable and JSON modes"
- G6: Define exit codes and error message conventions
- G7: Document global flags for configuration and data directory overrides
requirements:
  R1:
    title: Command Structure
    items:
    - R1.1:
        text: "The CLI executable must be named \"cupboard\""
        weight: 1
    - R1.2:
        text: "Commands must follow a two-tier structure"
        weight: 1
    - R1.3:
        text: "Generic table commands (get, set, delete, list) must accept any table name and work uniformly across all tables"
        weight: 2
    - R1.4:
        text: "Entity-specific commands (crumb, trail, etc.) must provide friendly flags and validation for that entity type"
        weight: 2
    - R1.5:
        text: The CLI must use cobra for command parsing and viper for configuration management
        weight: 1
  R2:
    title: Root Commands
    items:
    - R2.1:
        text: cupboard init must initialize the cupboard storage and print confirmation
        weight: 1
    - R2.2:
        text: cupboard version must print the version string
        weight: 1
  R3:
    title: Generic Table Commands
    items:
    - R3.1:
        text: "cupboard get <table> <id> must retrieve an entity by ID from the specified table"
        weight: 2
    - R3.2:
        text: "cupboard set <table> <id> <json> must create or update an entity"
        weight: 2
    - R3.3:
        text: "cupboard delete <table> <id> must remove an entity by ID"
        weight: 2
    - R3.4:
        text: "cupboard list <table> [filter...] must query entities with optional filters"
        weight: 1
  R4:
    title: Crumb Commands
    items:
    - R4.1:
        text: "Crumb commands must be grouped under \"cupboard crumb\""
        weight: 1
    - R4.2:
        text: "All crumb commands must support the --json flag for JSON output"
        weight: 2
    - R4.3:
        text: "cupboard crumb add must create a new crumb with entity-specific flags"
        weight: 2
    - R4.4:
        text: "cupboard crumb get <id> must retrieve a crumb with human-readable or JSON output"
        weight: 2
    - R4.5:
        text: cupboard crumb list must query crumbs with optional state filter
        weight: 1
    - R4.6:
        text: "cupboard crumb delete <id> must remove a crumb by ID"
        weight: 2
  R5:
    title: "Issue-Tracking Commands"
    items:
    - R5.1:
        text: "Issue-tracking commands must provide parity with the beads (bd) CLI for migration purposes"
        weight: 2
    - R5.2:
        text: cupboard ready must list crumbs that are ready for work
        weight: 1
    - R5.3:
        text: "cupboard create must create a new crumb with issue-tracking fields"
        weight: 2
    - R5.4:
        text: "cupboard show <id> must display a crumb with full details"
        weight: 1
    - R5.5:
        text: "cupboard update <id> must modify crumb fields"
        weight: 1
    - R5.6:
        text: "cupboard close <id> must transition a crumb to completed state"
        weight: 1
    - R5.7:
        text: "cupboard comments add <id> <text> must add a comment to a crumb"
        weight: 1
  R6:
    title: Global Flags
    items:
    - R6.1:
        text: All commands must inherit global flags from the root command
        weight: 1
    - R6.2:
        text: "--config-dir must override the configuration directory"
        weight: 1
    - R6.3:
        text: "--data-dir must override the data directory"
        weight: 1
    - R6.4:
        text: "--help must print usage information for any command"
        weight: 1
    - R6.5:
        text: "--version (on root command) must be an alias for cupboard version"
        weight: 1
  R7:
    title: Output Formats
    items:
    - R7.1:
        text: Commands must support two output modes
        weight: 2
    - R7.2:
        text: "Human-readable output must use tabwriter for aligned columns"
        weight: 1
    - R7.3:
        text: "JSON output must be pretty-printed with 2-space indentation"
        weight: 1
    - R7.4:
        text: "Error messages must be written to stderr, not stdout"
        weight: 1
    - R7.5:
        text: Successful output must be written to stdout
        weight: 1
    - R7.6:
        text: JSON output for single entities must be an object; for multiple entities must be an array
        weight: 1
    - R7.7:
        text: "Empty results must output an empty array [] in JSON mode, or \"No <entity> found.\" in human-readable mode"
        weight: 1
  R8:
    title: Exit Codes
    items:
    - R8.1:
        text: The CLI must use the following exit codes
        weight: 1
    - R8.2:
        text: "Exit code 0 must be returned for successful operations, including empty query results"
        weight: 1
    - R8.3:
        text: "Exit code 1 must be returned for user-correctable errors (bad input, missing entity)"
        weight: 1
    - R8.4:
        text: Exit code 2 must be returned for system errors that require investigation
        weight: 1
  R9:
    title: Error Messages
    items:
    - R9.1:
        text: "Error messages must follow the pattern \"context: details\""
        weight: 1
    - R9.2:
        text: Error messages must not include stack traces in normal operation
        weight: 1
    - R9.3:
        text: Error messages must include the entity ID or table name when relevant
        weight: 1
    - R9.4:
        text: Validation errors must explain what was expected
        weight: 1
  R10:
    title: Init Command
    items:
    - R10.1:
        text: cupboard init must initialize the storage backend
        weight: 1
    - R10.2:
        text: Init must create the data directory if it does not exist
        weight: 2
    - R10.3:
        text: Init must create empty JSONL files if they do not exist
        weight: 2
    - R10.4:
        text: "Init must seed built-in properties (priority, type, description, owner, labels) per srd004-properties-interface\
          \ R8"
        weight: 5
    - R10.5:
        text: Init must be idempotent (running init twice must not error or duplicate data)
        weight: 2
    - R10.6:
        text: "Init must print \"Cupboard initialized successfully\" on completion"
        weight: 1
non_goals:
- This SRD does not define a graphical user interface (GUI) or terminal user interface (TUI)
- "This SRD does not define shell completion scripts (bash, zsh, fish)"
- This SRD does not define a plugin system for custom commands
- "This SRD does not define remote backend support (HTTP, gRPC)"
- This SRD does not define batch operations beyond what the generic table commands provide
- This SRD does not define interactive mode or REPL functionality
