id: "srd007-links-interface"
title: Links Interface
implemented_by:
  - Entity Types
problem: |
  Links represent directed edges in the entity graph. They connect crumbs to trails (belongs_to), crumbs to crumbs (child_of), trails to crumbs (branches_from), and stashes to trails (scoped_to). Link requirements are currently scattered across four SRDs (srd002-sqlite-backend, srd006-trails-interface, srd008-stash-interface, srd003-crumbs-interface), making it difficult to understand the complete link behavior and constraints.

  We consolidate all link requirements into one authoritative source. Other SRDs should reference srd007-links-interface for link behavior rather than duplicating these specifications. The Link entity is the only entity without a dedicated interface SRD; srd007 fills that gap.
goals:
- G1: Define the Link struct with all required fields
- G2: Define valid link types and their semantics
- G3: Document CRUD operations via the Table interface
- G4: Define filter keys and query semantics
- G5: Document uniqueness constraint and indexes
- G6: Consolidate cardinality rules from other SRDs
- G7: Document error handling
- G8: Define graph audit functions for integrity validation
requirements:
  R1:
    title: Link Struct
    items:
    - R1.1:
        text: The Link struct must include the following fields
        weight: 1
    - R1.2:
        text: "LinkID must be a UUID v7 (time-ordered) generated by the backend when Table.Set is called with an empty LinkID"
        weight: 1
    - R1.3:
        text: FromID and ToID are entity IDs; the entity type depends on LinkType (see R2)
        weight: 1
    - R1.4:
        text: CreatedAt must be set to the current time on creation
        weight: 1
    - R1.5:
        text: "Links are immutable after creation. To change a relationship, delete the old link and create a new one"
        weight: 1
  R2:
    title: Link Types and Semantics
    items:
    - R2.1:
        text: LinkType must be one of the four valid types
        weight: 1
    - R2.2:
        text: Link type constants must be defined in pkg/constants
        weight: 1
    - R2.3:
        text: Table.Set must reject unrecognized LinkType values with ErrInvalidData
        weight: 1
    - R2.4:
        text: The graph formed by child_of links must be a DAG (no cycles). See R8 for validation
        weight: 8
  R3:
    title: CRUD via Table Interface
    items:
    - R3.1:
        text: Links are accessed via the Table interface
        weight: 1
    - R3.2:
        text: "To create a link, construct a Link struct and pass it to Table.Set with an empty ID"
        weight: 1
    - R3.3:
        text: "Table.Set must generate a UUID v7 for LinkID, set CreatedAt to now, and persist to both SQLite and links.jsonl"
        weight: 3
    - R3.4:
        text: Table.Get retrieves a link by LinkID. Returns ErrNotFound if not found. Returns ErrInvalidID if id is empty
        weight: 2
    - R3.5:
        text: Table.Delete removes a link by LinkID. Returns ErrNotFound if not found. Returns ErrInvalidID if id is empty
        weight: 2
    - R3.6:
        text: "Table.Fetch queries links matching a filter map. Returns []any that must be type-asserted to *Link"
        weight: 3
  R4:
    title: Filter Keys
    items:
    - R4.1:
        text: Supported filter keys for links
        weight: 1
    - R4.2:
        text: Multiple filter keys are ANDed. A link must match all specified criteria
        weight: 1
    - R4.3:
        text: An empty or nil filter matches all links
        weight: 1
    - R4.4:
        text: Unknown filter keys must be ignored (forward compatibility)
        weight: 1
  R5:
    title: Uniqueness Constraint
    items:
    - R5.1:
        text: "The combination (link_type, from_id, to_id) must be unique"
        weight: 1
    - R5.2:
        text: "Table.Set must reject duplicate links with the same (link_type, from_id, to_id) combination"
        weight: 1
    - R5.3:
        text: A crumb can have at most one belongs_to link (because the combination crumb+belongs_to+trail is unique)
        weight: 1
    - R5.4:
        text: A crumb can have multiple child_of links (different parent crumbs) and be the target of multiple child_of links
          (multiple children)
        weight: 1
    - R5.5:
        text: Indexes for efficient queries
        weight: 1
  R6:
    title: Cardinality Rules
    items:
    - R6.1:
        text: "belongs_to cardinality: A crumb can belong to at most one trail at a time. Enforced by uniqueness constraint\
          \ on (belongs_to, crumb_id, *)"
        weight: 1
    - R6.2:
        text: "child_of cardinality: Many-to-many. A crumb can have multiple parents and multiple children. The child_of graph\
          \ must be a DAG (no cycles)"
        weight: 8
    - R6.3:
        text: "branches_from cardinality: A trail can have at most one branches_from link. Enforced by uniqueness constraint\
          \ on (branches_from, trail_id, *)"
        weight: 1
    - R6.4:
        text: "scoped_to cardinality: A stash can have at most one scoped_to link. Enforced by uniqueness constraint on (scoped_to,\
          \ stash_id, *)"
        weight: 1
    - R6.5:
        text: Cardinality summary table
        weight: 1
  R7:
    title: Error Handling
    items:
    - R7.1:
        text: Link operations must return the following sentinel errors
        weight: 2
    - R7.2:
        text: All errors must be checkable with errors.Is
        weight: 1
    - R7.3:
        text: Uniqueness constraint violations (duplicate link) must return an error from Table.Set. The specific error depends
          on the backend implementation
        weight: 2
  R8:
    title: Graph Audit Functions
    items:
    - R8.1:
        text: The backend must provide audit functions to validate graph integrity
        weight: 8
    - R8.2:
        text: "ValidateDAG must detect cycles using depth-first search or topological sort. If a cycle is found, return an\
          \ error listing the crumb_ids involved"
        weight: 8
    - R8.3:
        text: ValidateReferences must validate all link types
        weight: 2
    - R8.4:
        text: "Audit functions run on startup after loading JSONL. If validation fails, Attach returns an error"
        weight: 8
    - R8.5:
        text: "Audit functions are also available as Cupboard methods for on-demand validation"
        weight: 8
non_goals:
- "This SRD does not define cascade behavior on trail completion or abandonment. See srd006-trails-interface for cascade semantics"
- "This SRD does not define entity-specific query patterns (e.g., finding all crumbs in a trail). Those patterns are documented\
  \ in the entity-specific SRDs"
- This SRD does not define link update operations. Links are immutable; delete and recreate to modify
- This SRD does not change the existing Link implementation
