id: "srd002-sqlite-backend"
title: SQLite Backend
implemented_by:
  - Cupboard and Config
used_by:
  - Entity Types
problem: |
  The SQLite backend needs a detailed specification for how JSONL files and SQLite interact. srd001-cupboard-core establishes that JSONL is the source of truth and SQLite serves as a query engine, but it does not specify the JSONL file format, SQLite schema, sync lifecycle, or error handling. Without this detail, implementation will make ad-hoc decisions that may not align with project goals.

  The backend must also implement the uniform Table interface defined in srd001-cupboard-core. Applications access data through `cupboard.GetTable("crumbs").Get(id)`, not through entity-specific methods. The backend must hydrate table rows into entity objects and persist entity objects back to rows. This ORM-style pattern keeps the interface consistent while allowing each entity type to have its own struct.

  This SRD specifies the SQLite backend internals: JSONL file layout, SQLite schema, startup loading, write persistence, shutdown flushing, error recovery, concurrency model, and the ORM layer that maps between Table operations and entity types.

  We store data as a directed acyclic graph (DAG). Crumbs and trails are nodes; relationships are edges stored in link tables. This separates how we store data from how we access it, enabling efficient queries for both.

  Nodes: Crumbs and trails are stored in separate tables. Both are nodes in the graph.

  Edges (links): Relationships between nodes are stored in the links table (see ARCHITECTURE Decision 10):

  | Link type | From | To | Cardinality |
  |--------------|--------|--------|---------------------------------------------|
  | belongs_to | crumb | trail | many-to-one (crumb belongs to one trail) |
  | child_of | crumb | crumb | many-to-many (DAG of crumbs within a trail) |
  | branches_from | trail | crumb | one-to-one (trail branches from a crumb) |
  | scoped_to | stash | trail | one-to-one (stash scoped to a trail) |

  Query patterns:

  - Find all crumbs in a trail: query belongs_to by to_id (trail_id)
  - Find child crumbs of a crumb: query child_of by to_id (parent crumb_id)
  - Find parent crumbs of a crumb: query child_of by from_id (child crumb_id)
  - Find branch point of a trail: query branches_from by from_id (trail_id)
  - Find stashes scoped to a trail: query scoped_to by to_id (trail_id)
  - Traverse the DAG: recursive CTE on child_of

  Integrity: Audit functions validate the graph (no cycles, valid references, DAG structure).
goals:
- G1: Define the JSONL file format and directory layout within DataDir
- G2: Define the SQLite schema that mirrors the JSONL structure
- G3: "Specify the startup sequence: loading JSONL into SQLite"
- G4: "Specify write behavior: updating SQLite and persisting to JSONL"
- G5: "Specify shutdown behavior: flushing pending writes"
- G6: "Define error handling for corrupt files, schema mismatches, and I/O failures"
- G7: Define the concurrency model for safe concurrent access
- G8: Specify how the backend implements the Cupboard interface (Attach/Detach)
- G9: Specify how GetTable routes table names to table implementations
- G10: "Define entity hydration: converting table rows to entity objects"
- G11: "Define entity persistence: converting entity objects to table rows"
requirements:
  D:
    title: Design Decisions
    items:
    - R0.1:
        text: "Hydration and dehydration functions are independent of each other and of all table accessors. A hydration function\
          \ for Crumb does not call any function in any other entity's hydration file. This independence is the precondition\
          \ that allows hydration to be implemented in two separate tasks."
        weight: 1
    - R0.2:
        text: "The backend embeds a sync.RWMutex directly in the backend struct. The mutex is value-initialized (no constructor).\
          \ Attach acquires the write lock for its entire duration. GetTable, Detach, and all table operations acquire the\
          \ appropriate lock (read or write) on entry and release it on return. This is the only synchronization primitive\
          \ in the backend; there are no channel-based synchronization patterns."
        weight: 1
    - R0.3:
        text: "The startup sequence is a single, non-interruptible operation. If any step fails, Attach returns an error and\
          \ the backend is left in a detached state. The sequence is: (1) create DataDir if missing, (2) delete stale cupboard.db\
          \ if present, (3) create new cupboard.db and apply schema, (4) load each JSONL file line by line, (5) run FK validation\
          \ and DAG audit, (6) seed built-in properties if properties.jsonl was empty, (7) mark the backend as attached. No\
          \ table accessors are returned until step 7 completes."
        weight: 1
  R1:
    title: Directory Layout
    items:
    - R1.1:
        text: The SQLite backend operates within a single directory (DataDir from Config)
        weight: 1
    - R1.2:
        text: DataDir must contain the following files
        weight: 1
    - R1.3:
        text: "If DataDir does not exist, Attach must create it"
        weight: 2
    - R1.4:
        text: "If JSONL files do not exist, Attach must create empty files (zero bytes, not empty arrays)"
        weight: 2
  R2:
    title: JSONL File Format
    items:
    - R2.1:
        text: Each JSONL file contains one JSON object per line. Empty lines are skipped during loading
        weight: 1
    - R2.2:
        text: crumbs.jsonl format (one line per crumb)
        weight: 1
    - R2.3:
        text: trails.jsonl format (one line per trail)
        weight: 1
    - R2.4:
        text: properties.jsonl format (one line per property)
        weight: 1
    - R2.5:
        text: categories.jsonl format (one line per category)
        weight: 1
    - R2.6:
        text: "crumb_properties.jsonl format (one line per property value, unified with type in field)"
        weight: 1
    - R2.7:
        text: "links.jsonl format (one line per link, graph edges)"
        weight: 1
    - R2.8:
        text: metadata.jsonl format (one line per metadata entry)
        weight: 1
    - R2.9:
        text: stashes.jsonl format (one line per stash)
        weight: 1
    - R2.10:
        text: "stash_history.jsonl format (one line per history entry, append-only)"
        weight: 1
    - R2.11:
        text: All timestamps must be RFC 3339 format (ISO 8601 with timezone)
        weight: 1
    - R2.12:
        text: All UUIDs must be lowercase hyphenated format
        weight: 1
  R3:
    title: SQLite Schema
    items:
    - R3.1:
        text: The SQLite database uses a single file (cupboard.db) in DataDir
        weight: 1
    - R3.2:
        text: SQLite schema must mirror JSONL structure for direct loading
        weight: 5
    - R3.3:
        text: Indexes for common queries
        weight: 1
    - R3.4:
        text: "The value column in crumb_properties stores JSON-encoded values for all types. For categorical properties,\
          \ it stores the category_id. For lists, it stores a JSON array"
        weight: 1
  R4:
    title: Startup Sequence
    items:
    - R4.0:
        text: "The startup sequence must follow the order in R0.3 exactly. Steps 1-7 must complete before Attach returns.\
          \ If any step fails, all resources acquired in prior steps must be released before returning the error."
        weight: 8
    - R4.2:
        text: "If any JSONL file contains malformed lines (invalid JSON), skip those lines and log a warning. Malformed lines\
          \ do not halt loading"
        weight: 1
    - R4.3:
        text: "If foreign key validation fails (e.g., crumb references non-existent trail), Attach must return an error. We\
          \ do not auto-repair"
        weight: 2
  R5:
    title: Write Operations
    items:
    - R5.3:
        text: "By default, write operations persist immediately (no batching). This ensures JSONL files are always current.\
          \ The sync strategy is configurable via SQLiteConfig; see R16 for options"
        weight: 3
    - R5.4:
        text: "If JSONL persistence fails after SQLite commit, the operation must return an error. The next Attach will reload\
          \ from JSONL (the source of truth), so SQLite and JSONL will reconcile"
        weight: 3
    - R5.5:
        text: Table operations and the JSONL files they affect
        weight: 1
    - R5.6:
        text: "Trail cascade behavior on Table.Set: When a Trail is persisted via trails.Set and its State has changed, for\
          \ State → completed remove all `belongs_to` links where to_id equals the trail ID (the crumbs remain but are no\
          \ longer associated with any trail, becoming permanent, affects trails.jsonl and links.jsonl), for State → abandoned\
          \ delete all crumbs that belong to this trail (via belongs_to links) including each deleted crumb's property values,\
          \ metadata, and all links involving the crumb (affects trails.jsonl, crumbs.jsonl, crumb_properties.jsonl, metadata.jsonl,\
          \ links.jsonl)"
        weight: 8
    - R5.7:
        text: "The cascade behavior is triggered by detecting a state change when persisting. Entity methods (Trail.Complete,\
          \ Trail.Abandon) update the struct's State field; the backend detects the change and performs cascades during Set"
        weight: 8
  R6:
    title: Shutdown Sequence
    items:
    - R6.2:
        text: Detach must be idempotent. Subsequent calls return nil
        weight: 2
    - R6.3:
        text: "After Detach, all operations must return ErrCupboardDetached"
        weight: 1
  R7:
    title: Error Handling
    items:
    - R7.1:
        text: "If a JSONL file contains malformed lines (invalid JSON), the backend must skip those lines, log a warning with\
          \ the line number and file path, and continue loading. Malformed lines must not halt Attach"
        weight: 1
    - R7.2:
        text: "If DataDir does not exist and cannot be created (e.g., permission denied), Attach must return an error describing\
          \ the path and the OS error"
        weight: 2
    - R7.3:
        text: "If a JSONL write fails after the temp file is written but before the atomic rename (e.g., I/O error, disk full),\
          \ the backend must return an error. The original JSONL file remains intact because the rename did not complete"
        weight: 5
    - R7.4:
        text: "If a JSONL file exists but a record contains unrecognized fields, the backend must ignore the unknown fields\
          \ and load the record using the known fields. This supports forward compatibility when older code reads newer JSONL"
        weight: 1
    - R7.5:
        text: "If a temp file from a previous crashed write is found in DataDir on startup (matching the *.jsonl.tmp pattern),\
          \ the backend must delete it before loading. Temp files represent incomplete writes and must not be loaded"
        weight: 2
  R8:
    title: Concurrency Model
    items:
    - R8.1:
        text: "The SQLite backend supports single-writer, multiple-reader within a process"
        weight: 1
    - R8.2:
        text: Write operations acquire an exclusive lock. Only one write at a time
        weight: 1
    - R8.3:
        text: "Read operations (Table.Get, Table.Fetch) can run concurrently with each other"
        weight: 1
    - R8.4:
        text: Read operations block during the write phase but can proceed during JSONL persistence
        weight: 1
    - R8.5:
        text: "Cross-process concurrency is not supported. Only one process should open a DataDir at a time. If a second process\
          \ attempts to open, behavior is undefined (SQLite may lock, JSONL writes may conflict)"
        weight: 1
  R9:
    title: "Built-in Properties"
    items:
    - R9.1:
        text: "On first startup (empty properties.jsonl), the backend must seed the following built-in properties"
        weight: 5
    - R9.2:
        text: "Built-in categories for priority"
        weight: 1
    - R9.3:
        text: "Built-in categories for type"
        weight: 1
    - R9.4:
        text: Seeding only occurs if properties.jsonl is empty (first run). Existing data is never modified
        weight: 1
  R10:
    title: Graph Audit
    items:
    - R10.1:
        text: The backend must provide audit functions to validate graph integrity
        weight: 8
    - R10.2:
        text: "ValidateDAG must detect cycles using depth-first search or topological sort. If a cycle is found, return an\
          \ error listing the crumb_ids involved"
        weight: 8
    - R10.4:
        text: "Audit functions run on startup after loading JSONL. If validation fails, Attach returns an error"
        weight: 8
    - R10.5:
        text: "Audit functions are also available as Cupboard methods for on-demand validation"
        weight: 8
  R11:
    title: Cupboard Interface Implementation
    items:
    - R11.1:
        text: "The SQLite backend implements the Cupboard interface defined in srd001-cupboard-core"
        weight: 1
    - R11.3:
        text: Attach must store the Config and mark the cupboard as attached. Subsequent Attach calls return ErrAlreadyAttached
        weight: 1
    - R11.5:
        text: "After Detach, all operations including GetTable must return ErrCupboardDetached"
        weight: 1
  R12:
    title: Table Name Routing
    items:
    - R12.1:
        text: GetTable accepts a table name and returns a Table implementation for that entity type
        weight: 1
    - R12.2:
        text: GetTable must return ErrTableNotFound for unrecognized table names
        weight: 1
    - R12.3:
        text: GetTable returns a table accessor bound to the specific entity type. Each table accessor implements the Table
          interface but operates on its corresponding entity struct
        weight: 1
    - R12.4:
        text: Table accessors are created once during Attach and reused. GetTable returns the same accessor instance for repeated
          calls with the same name
        weight: 1
  R13:
    title: Table Interface Implementation
    items:
    - R13.1:
        text: Each table accessor implements the Table interface
        weight: 1
    - R13.6:
        text: "Filter map keys correspond to entity field names (Go struct field names, not JSON/SQL column names). The table\
          \ accessor maps field names to column names"
        weight: 3
  R14:
    title: Entity Hydration
    items:
    - R14.0:
        text: "Hydration for core types (R14.1) must be complete before hydration for supporting types (R14.2) begins. stitch\
          \ must generate these as two separate tasks. Neither task may depend on the other's output; they share only the\
          \ base hydration pattern defined in R14.1."
        weight: 3
    - R14.1:
        text: "Core types (Crumb, Trail, Property) — implement in internal/persistence/mapping/. Hydration converts a SQLite\
          \ row into an entity struct. Each table accessor defines hydration for its entity type. Must be complete before\
          \ R14.2."
        weight: 3
    - R14.2:
        text: Hydration mapping for Crumb (from crumbs table)
        weight: 3
    - R14.3:
        text: Hydration mapping for Trail (from trails table)
        weight: 3
    - R14.4:
        text: Hydration mapping for Property (from properties table)
        weight: 3
    - R14.2:
        text: "Supporting types (Metadata, Link, Stash, StashHistory) — implement in internal/persistence/mapping/. Depends\
          \ on R14.1 being complete."
        weight: 1
    - R14.5:
        text: Hydration mapping for Metadata (from metadata table)
        weight: 3
    - R14.6:
        text: Hydration mapping for Link (from links table)
        weight: 3
    - R14.7:
        text: Hydration mapping for Stash (from stashes table)
        weight: 3
    - R14.8:
        text: "Nullable columns hydrate to pointer types or zero values. If the column is NULL and the Go field is a pointer,\
          \ set it to nil. If the Go field is not a pointer, return an error (schema violation)"
        weight: 3
    - R14.9:
        text: Time conversion uses time.Parse with RFC 3339 format. Invalid timestamps cause hydration to fail with an error
        weight: 3
  R15:
    title: Entity Persistence
    items:
    - R15.1:
        text: Persistence (dehydration) converts an entity struct into SQL parameters for INSERT or UPDATE
        weight: 3
    - R15.2:
        text: Dehydration is the inverse of hydration. Each table accessor maps Go struct fields to SQL column values
        weight: 3
    - R15.3:
        text: Time fields convert to RFC 3339 strings using time.Format
        weight: 1
    - R15.4:
        text: "Pointer fields convert to NULL if nil, otherwise to the dereferenced value"
        weight: 1
    - R15.5:
        text: "For Stash.Value (any type), persistence must JSON-encode the value before storing"
        weight: 1
    - R15.6:
        text: "Set determines INSERT vs UPDATE by checking if a row with the given ID exists. If no row exists, INSERT; if\
          \ row exists, UPDATE"
        weight: 3
    - R15.7:
        text: UUID v7 generation occurs in Set when the entity ID field is empty. The generated ID is assigned to the entity
          before persistence
        weight: 2
    - R15.8:
        text: "After SQLite persistence, the entity must be written to the corresponding JSONL file following the atomic write\
          \ pattern (R5.2)"
        weight: 3
    - R15.9:
        text: "Core types (Crumb, Trail, Property) — implement dehydration functions for these entity types first. Must be\
          \ complete before R15.10."
        weight: 3
    - R15.10:
        text: "Supporting types (Metadata, Link, Stash, StashHistory) — implement dehydration functions after R15.9 is complete.\
          \ R15.5 (Stash.Value JSON encoding) applies to this group."
        weight: 3
  R16:
    title: JSONL Sync Strategy
    items:
    - R16.1:
        text: The SQLite backend supports configurable sync strategies via SQLiteConfig.SyncStrategy
        weight: 1
    - R16.2:
        text: "When SyncStrategy is empty or \"immediate\", the backend writes to JSONL after every SQLite commit (current\
          \ behavior per R5.3). This is the default"
        weight: 1
    - R16.3:
        text: "When SyncStrategy is \"on_close\", the backend defers JSONL writes. SQLite remains the write cache during the\
          \ session. On Detach, all pending changes are flushed to JSONL files before closing. On crash, unwritten changes\
          \ are lost; the next Attach loads from the (stale) JSONL files"
        weight: 1
    - R16.5:
        text: Batch mode configuration
        weight: 5
    - R16.6:
        text: "For batch mode, at least one of BatchSize or BatchInterval must be positive. If both are zero, validation fails"
        weight: 5
    - R16.7:
        text: "Atomic write semantics (R5.2) apply regardless of sync strategy. When flushing, each JSONL file is written\
          \ atomically (temp file, fsync, rename)"
        weight: 5
    - R16.8:
        text: The sync strategy does not affect SQLite durability. SQLite transactions commit synchronously regardless of
          JSONL sync strategy
        weight: 1
package_contract:
  exports:
  - name: SQLiteConfig
    signature: "type SQLiteConfig struct { SyncStrategy string; BatchSize int; BatchInterval time.Duration }"
  - name: NewSQLiteBackend
    signature: func NewSQLiteBackend() api.Cupboard
  - name: HydrateCrumb
    signature: "func HydrateCrumb(row sql.Row) (*schema.Crumb, error)"
  - name: HydrateTrail
    signature: "func HydrateTrail(row sql.Row) (*schema.Trail, error)"
  - name: HydrateProperty
    signature: "func HydrateProperty(row sql.Row) (*schema.Property, error)"
  - name: PersistCrumb
    signature: "func PersistCrumb(crumb *schema.Crumb) []any"
  - name: PersistTrail
    signature: "func PersistTrail(trail *schema.Trail) []any"
  - name: PersistProperty
    signature: "func PersistProperty(prop *schema.Property) []any"
  imports:
  - pkg/api
  - pkg/schema
  - pkg/constants
  - modernc.org/sqlite
  import_constraints:
  - internal/persistence must not import cmd/
  - "internal/persistence/engine must not import pkg/schema (entity-agnostic)"
  - internal/persistence/mapping must not import internal/persistence/engine
non_goals:
- "This SRD does not define the Cupboard interface operations. Those are in srd001-cupboard-core and the interface SRDs"
- "This SRD does not define cross-process locking. Single-process access is assumed"
- This SRD does not define backup or migration utilities
