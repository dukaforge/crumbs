id: "srd005-metadata-interface"
title: Metadata Interface
implemented_by:
  - Entity Types
problem: |
  Applications need to attach supplementary information to crumbs beyond structured properties. A developer might add comments during work, attach log files for debugging, or link to external resources. Properties handle typed, single-value attributes; metadata handles unstructured, multi-value content like comments, attachments, and activity logs.

  Hardcoding metadata types (comments table, attachments table) creates rigid schemas. Applications should be able to define new metadata types through schema registration without code changes. A plugin might add "reviews" or "time_entries" as new metadata types.

  srd001-cupboard-core defines the Cupboard interface with uniform Table access, but it does not specify the Metadata entity structure or how metadata interacts with the Table interface. This SRD defines the Metadata entity: the struct fields, schema registration for extensible metadata tables, and how metadata is stored and retrieved via the Table interface.
goals:
- G1: Define the Metadata struct with all required fields
- G2: Define the Schema struct for metadata table schema registration
- G3: "Specify how metadata is created, stored, and queried via the Table interface"
- G4: Define filter conventions for querying metadata
- G5: "Document built-in metadata schemas (comments, attachments)"
- G6: Specify schema registration for custom metadata types
- G7: Document error conditions for metadata operations
requirements:
  R1:
    title: Metadata Struct
    items:
    - R1.1:
        text: The Metadata struct must include the fields defined in the following table
        weight: 1
    - R1.2:
        text: "MetadataID must be a UUID v7 (time-ordered) generated by the backend when Table.Set is called with an empty\
          \ MetadataID"
        weight: 1
    - R1.3:
        text: CrumbID links the metadata to a specific crumb. The crumb must exist; Table.Set validates this
        weight: 1
    - R1.4:
        text: TableName identifies which schema the entry belongs to. Only registered schema names are valid
        weight: 1
    - R1.5:
        text: "PropertyID is optional. When set, the metadata is associated with a specific property on the crumb (e.g., a\
          \ comment about the priority value). If provided, the property must exist"
        weight: 1
    - R1.6:
        text: "Content stores the actual metadata. For simple metadata like comments, this is plain text. For structured metadata,\
          \ this may be JSON"
        weight: 1
  R2:
    title: Schema Struct
    items:
    - R2.1:
        text: The Schema struct defines a metadata schema
        weight: 1
    - R2.2:
        text: SchemaName must be unique across all registered schemas
        weight: 1
    - R2.3:
        text: "SchemaName must be non-empty and contain only lowercase letters, numbers, and underscores"
        weight: 1
    - R2.4:
        text: "ContentType hints at how Content should be interpreted. \"text\" means plain text; \"json\" means JSON-formatted\
          \ content. The backend does not validate content against this type; it is advisory"
        weight: 1
    - R2.5:
        text: "Schema is intentionally minimal. The metadata system stores flexible content; schema describes intent, not\
          \ strict structure"
        weight: 1
  R3:
    title: "Built-in Schemas"
    items:
    - R3.1:
        text: "The backend must pre-register the built-in metadata schemas on startup"
        weight: 1
    - R3.2:
        text: "Built-in schemas are always available; applications do not need to register them"
        weight: 1
    - R3.3:
        text: "Built-in schemas cannot be unregistered or modified"
        weight: 1
    - R3.4:
        text: Comments schema stores plain text comments. Each new metadata entry creates a new comment
        weight: 1
    - R3.5:
        text: Attachments schema stores JSON objects describing file attachments
        weight: 1
    - R3.6:
        text: "The attachments content format is advisory; the backend stores the JSON as-is without validation"
        weight: 1
  R4:
    title: Creating Metadata
    items:
    - R4.1:
        text: "To create a new metadata entry, the caller constructs a Metadata struct and passes it to Table.Set"
        weight: 1
    - R4.2:
        text: "When Table.Set is called with an empty ID, the backend must: generate a UUID v7 for MetadataID; set CreatedAt\
          \ to now; validate that TableName is a registered schema (return ErrSchemaNotFound if not); validate that CrumbID\
          \ references an existing crumb (return ErrNotFound if not); validate that Content is non-empty (return ErrInvalidContent\
          \ if empty); if PropertyID is set, validate that the property exists (return ErrPropertyNotFound if not)"
        weight: 1
    - R4.3:
        text: "Validation in R4.2 is atomic: if any validation fails, the metadata is not created"
        weight: 1
    - R4.4:
        text: "After successful creation, the Metadata struct is updated with the generated MetadataID and timestamp"
        weight: 1
    - R4.5:
        text: "Multiple metadata entries can be added to the same crumb for the same schema. Comments are additive, not replacements"
        weight: 1
  R5:
    title: Retrieving Metadata
    items:
    - R5.1:
        text: "To retrieve a metadata entry by ID, use Table.Get"
        weight: 1
    - R5.2:
        text: "Table.Get returns the entity as any; the caller must type-assert to *Metadata"
        weight: 1
    - R5.3:
        text: Table.Get returns ErrNotFound if no metadata exists with the given ID
        weight: 1
    - R5.4:
        text: Table.Get returns ErrInvalidID if id is empty
        weight: 1
  R6:
    title: Metadata Lifecycle
    items:
    - R6.1:
        text: "Metadata entries are append-only by convention. There is no intended Update operation; new entries add context\
          \ rather than replace old entries"
        weight: 1
    - R6.2:
        text: Table.Set with an existing MetadataID is technically permitted but discouraged. The backend updates the record
          if called
        weight: 1
    - R6.3:
        text: "Table.Delete removes a metadata entry by ID. This is intended for cleanup scenarios, not normal use"
        weight: 2
    - R6.4:
        text: Table.Delete returns ErrNotFound if no metadata exists with the given ID
        weight: 1
    - R6.5:
        text: "When a crumb is deleted (via the crumbs table), all its metadata entries must also be deleted (cascading delete)"
        weight: 1
    - R6.6:
        text: Metadata entries cannot be moved between crumbs; CrumbID is immutable after creation
        weight: 1
  R7:
    title: Filter Map
    items:
    - R7.1:
        text: "Filters are expressed as map[string]any where keys are filter names and values are filter criteria"
        weight: 3
    - R7.2:
        text: Supported filter keys for metadata are defined in the following table
        weight: 1
    - R7.3:
        text: An empty or nil filter matches all metadata entries
        weight: 1
    - R7.4:
        text: "Multiple filter keys are ANDed: a metadata entry must match all specified criteria"
        weight: 1
    - R7.5:
        text: Unknown filter keys must be ignored (forward compatibility)
        weight: 1
    - R7.6:
        text: Results are ordered by CreatedAt ascending (oldest first) by default
        weight: 1
  R8:
    title: Querying Metadata
    items:
    - R8.1:
        text: "To query metadata, use Table.Fetch with a filter map"
        weight: 3
    - R8.2:
        text: "Table.Fetch returns a slice of entities ([]any); the caller must type-assert each element to *Metadata"
        weight: 1
    - R8.3:
        text: Table.Fetch returns an empty slice (not nil) if no metadata entries match
        weight: 1
    - R8.4:
        text: Table.Fetch applies limit and offset after filtering and ordering
        weight: 3
    - R8.5:
        text: Table.Fetch does not return an error for an empty result set
        weight: 1
    - R8.6:
        text: Table.Fetch returns ErrInvalidFilter if a filter value has the wrong type
        weight: 1
  R9:
    title: Schema Registration
    items:
    - R9.1:
        text: "Applications can register custom schemas beyond the built-in schemas. Schema registration is handled separately\
          \ from the metadata Table interface"
        weight: 1
    - R9.2:
        text: "The Cupboard must provide a schema registration mechanism. Implementations may: expose a RegisterSchema method\
          \ on the Cupboard; use a dedicated schemas table where schemas are persisted as entities; pre-load schemas from\
          \ configuration"
        weight: 2
    - R9.3:
        text: "Schema registration must validate: SchemaName is non-empty and valid format (lowercase, numbers, underscores\
          \ only); SchemaName is unique (not already registered)"
        weight: 2
    - R9.4:
        text: Registration returns ErrDuplicateName if the schema name already exists
        weight: 1
    - R9.5:
        text: Registration returns ErrInvalidName if the schema name is empty or invalid format
        weight: 1
    - R9.6:
        text: Schemas cannot be unregistered once registered. This prevents orphaned metadata entries
        weight: 1
  R10:
    title: Error Types
    items:
    - R10.1:
        text: Metadata operations and Table operations must return the sentinel errors defined in the following table
        weight: 2
    - R10.2:
        text: All errors must be checkable with errors.Is
        weight: 1
non_goals:
- "This SRD does not define the Table interface or Cupboard interface. See srd001-cupboard-core."
- "This SRD does not define crumb operations. See srd003-crumbs-interface."
- "This SRD does not define property definitions. See srd004-properties-interface."
- This SRD does not define file storage for attachments. The attachments schema stores references; actual file handling is
  outside this scope.
- "This SRD does not define full-text search indexing. The content_contains filter is substring matching, not ranked search."
- "This SRD does not define schema enforcement. ContentType is advisory; content is stored as-is."
- "This SRD does not define batch operations for metadata (e.g., bulk add, bulk delete)."
