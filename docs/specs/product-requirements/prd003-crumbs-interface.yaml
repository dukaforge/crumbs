id: "prd003-crumbs-interface"
title: Crumbs Interface
problem: |
  Applications need to create, retrieve, and manage individual work items (crumbs). prd001-cupboard-core defines the Cupboard interface with uniform Table access, but it does not specify the Crumb entity structure, entity methods, or how crumbs interact with the Table interface. Without this specification, implementations will make inconsistent decisions about field names, state transitions, and property handling.

  This PRD defines the Crumb entity: the struct fields, entity methods for state management and property access, and how crumbs are stored and retrieved via the Table interface. Trail membership is not stored on the Crumb; the links table (prd002-sqlite-backend) handles belongs_to relationships.
goals:
- G1: Define the Crumb struct with all required fields
- G2: Define state values and their meaning
- G3: "Define entity methods for state transitions (SetState, Pebble, Dust)"
- G4: "Define entity methods for property access (SetProperty, GetProperty, GetProperties, ClearProperty)"
- G5: "Specify how crumbs are created, stored, and queried via the Table interface"
- G6: Specify state validation rules for entity methods
- G7: Document error conditions for entity operations
requirements:
  D:
    title: Design Decisions
    items:
    - R0.1:
        text: "Entity methods (SetState, Pebble, Dust, SetProperty, GetProperty, GetProperties, ClearProperty) are implemented\
          \ entirely in pkg/schema/crumb.go. They operate only on the Crumb struct in memory. They do not import internal/persistence\
          \ or any backend package. Persistence is always the caller's responsibility — after calling an entity method, the\
          \ caller passes the modified struct to Table.Set."
        weight: 1
    - R0.2:
        text: The Crumbs table accessor is implemented in internal/persistence/crumbs_table.go. It implements the Table interface
          for the crumbs table. It imports pkg/schema for the Crumb struct but does not call any Crumb entity methods directly;
          it reads and writes struct fields.
        weight: 1
  R1:
    title: Crumb Struct
    items:
    - R1.1:
        text: The Crumb struct must include the following fields
        weight: 1
    - R1.2:
        text: "CrumbID must be a UUID v7 (time-ordered) generated by the backend when Table.Set is called with an empty CrumbID"
        weight: 1
    - R1.3:
        text: "Name must be non-empty. Entity methods that modify name must validate non-empty"
        weight: 2
    - R1.4:
        text: "Trail membership is not a Crumb field. Use the links table (belongs_to link type) to associate crumbs with\
          \ trails. See prd002-sqlite-backend"
        weight: 1
    - R1.5:
        text: "CreatedAt and UpdatedAt must be set to the current time on creation. UpdatedAt must be updated on any modification\
          \ (state change, property change)"
        weight: 1
    - R1.6:
        text: "Properties is a map from property_id to value. All defined properties are initialized with type-based defaults\
          \ on creation (see R3)"
        weight: 1
  R2:
    title: State Values
    items:
    - R2.1:
        text: A crumb must be in exactly one of the following states
        weight: 1
    - R2.2:
        text: Initial state on creation is draft
        weight: 1
    - R2.3:
        text: State transitions are validated by entity methods (see R4). Direct modification of the State field bypasses
          validation; callers should use entity methods
        weight: 3
    - R2.4:
        text: "State is stored as a string, not an enum, for JSON compatibility"
        weight: 1
  R3:
    title: Creating Crumbs
    items:
    - R3.1:
        text: "To create a new crumb, the caller constructs a Crumb struct and passes it to Table.Set"
        weight: 1
    - R3.2:
        text: "When Table.Set is called with an empty ID, the backend must generate a UUID v7 for CrumbID, set State to \"\
          draft\", set CreatedAt to now, set UpdatedAt to now, and initialize Properties map with all defined properties set\
          \ to their type-based default values (see prd004-properties-interface R3.5)"
        weight: 2
    - R3.4:
        text: "Table.Set must validate that Name is non-empty and return ErrInvalidName if empty"
        weight: 2
    - R3.5:
        text: "After successful creation, the Crumb struct is updated with the generated CrumbID, timestamps, and initialized\
          \ Properties"
        weight: 1
  R4:
    title: State Transition Methods
    items:
    - R4.0:
        text: "Entity methods (R4-R5) must be implemented before the Crumbs table accessor (R6-R11). The table accessor imports\
          \ pkg/schema/crumb.go; that file must exist and compile before internal/persistence/crumbs_table.go is generated."
        weight: 1
    - R4.1:
        text: The Crumb struct provides methods for common state transitions
        weight: 3
    - R4.5:
        text: "After calling any state transition method, the caller must save the crumb with Table.Set to persist the changes"
        weight: 3
  R5:
    title: Property Methods
    items:
    - R5.1:
        text: The Crumb struct provides methods for property access
        weight: 1
    - R5.2:
        text: "SetProperty assigns a value to a property. Must validate that the property exists (return ErrPropertyNotFound\
          \ if not; requires property definitions lookup), must validate that value matches the property's value_type (return\
          \ ErrTypeMismatch if not), for categorical properties value must be a valid category_id (return ErrInvalidCategory\
          \ if not), must update the Properties map, must update the UpdatedAt timestamp"
        weight: 2
    - R5.3:
        text: "GetProperty retrieves a single property value. Must return the value from the Properties map. Since all properties\
          \ are initialized on crumb creation (R3.2), the property always has a value. Must return ErrPropertyNotFound if\
          \ the property does not exist (not in Properties map)"
        weight: 5
    - R5.4:
        text: GetProperties retrieves all property values. Must return the Properties map. The map contains an entry for every
          defined property. The map is empty only if no properties are defined
        weight: 2
    - R5.6:
        text: "After calling any property method that modifies state, the caller must save the crumb with Table.Set to persist\
          \ the changes"
        weight: 2
  R6:
    title: Retrieving Crumbs
    items:
    - R6.0:
        text: "Table accessor group (R6-R11) — implement in internal/persistence/crumbs_table.go. Depends on R4-R5 (entity\
          \ methods in pkg/schema/crumb.go) being complete."
        weight: 1
    - R6.1:
        text: "To retrieve a crumb by ID, use Table.Get"
        weight: 1
    - R6.2:
        text: "Table.Get returns the entity as any; the caller must type-assert to *Crumb"
        weight: 1
    - R6.3:
        text: Table.Get returns ErrNotFound if no crumb exists with the given ID
        weight: 1
    - R6.4:
        text: Table.Get returns ErrInvalidID if id is empty
        weight: 1
  R7:
    title: Updating Crumbs
    items:
    - R7.1:
        text: "To update a crumb, retrieve it with Table.Get, modify it with entity methods or direct field access, and save\
          \ it with Table.Set"
        weight: 1
    - R7.2:
        text: "Direct field modification (e.g., changing Name) does not automatically update UpdatedAt. The caller must update\
          \ UpdatedAt manually when modifying fields directly"
        weight: 1
    - R7.3:
        text: "Entity methods (SetState, SetProperty, etc.) automatically update UpdatedAt"
        weight: 1
    - R7.4:
        text: "Table.Set validates that Name is non-empty and returns ErrInvalidName if empty"
        weight: 1
  R8:
    title: Deleting Crumbs
    items:
    - R8.1:
        text: "To soft-delete a crumb, use the Dust entity method and save"
        weight: 1
    - R8.2:
        text: "To hard-delete a crumb, use Table.Delete"
        weight: 1
    - R8.4:
        text: Table.Delete returns ErrNotFound if no crumb exists with the given ID
        weight: 1
    - R8.5:
        text: Table.Delete returns ErrInvalidID if id is empty
        weight: 1
    - R8.7:
        text: Dust crumbs remain queryable via Table.Fetch. Applications filter by state to exclude dust crumbs from active
          views
        weight: 1
  R9:
    title: Filter Map
    items:
    - R9.1:
        text: "Filters are expressed as map[string]any where keys are filter names and values are filter criteria"
        weight: 3
    - R9.2:
        text: Supported filter keys for crumbs
        weight: 1
    - R9.3:
        text: An empty or nil filter matches all crumbs
        weight: 1
    - R9.5:
        text: Unknown filter keys must be ignored (forward compatibility)
        weight: 1
    - R9.6:
        text: Results are ordered by CreatedAt descending (newest first)
        weight: 1
  R10:
    title: Querying Crumbs
    items:
    - R10.1:
        text: "To query crumbs, use Table.Fetch with a filter map"
        weight: 3
    - R10.2:
        text: "Table.Fetch returns a slice of entities ([]any); the caller must type-assert each element to *Crumb"
        weight: 1
    - R10.3:
        text: Table.Fetch returns an empty slice (not nil) if no crumbs match
        weight: 1
    - R10.4:
        text: Table.Fetch applies limit and offset after filtering and ordering
        weight: 3
    - R10.5:
        text: Table.Fetch does not return an error for an empty result set
        weight: 1
    - R10.6:
        text: "Table.Fetch returns ErrInvalidFilter if a filter value has the wrong type (e.g., \"states\" is not []string)"
        weight: 1
  R11:
    title: Error Types
    items:
    - R11.1:
        text: Crumb entity methods and Table operations must return the following sentinel errors
        weight: 2
    - R11.2:
        text: All errors must be checkable with errors.Is
        weight: 1
package_contract:
  exports:
  - name: Crumb
    signature: "type Crumb struct { CrumbID string; Name string; State string; CreatedAt time.Time; UpdatedAt time.Time; Properties\
      \ map[string]any }"
  - name: Crumb.SetState
    signature: "func (c *Crumb) SetState(state string) error"
  - name: Crumb.Pebble
    signature: "func (c *Crumb) Pebble() error"
  - name: Crumb.Dust
    signature: "func (c *Crumb) Dust() error"
  - name: Crumb.SetProperty
    signature: "func (c *Crumb) SetProperty(propertyID string, value any) error"
  - name: Crumb.GetProperty
    signature: "func (c *Crumb) GetProperty(propertyID string) (any, error)"
  import_constraints:
  - pkg/schema must not import pkg/api or internal/
non_goals:
- "This PRD does not define the Table interface or Cupboard interface. See prd001-cupboard-core"
- "This PRD does not define trail operations. See prd006-trails-interface"
- "This PRD does not define property definitions. See prd004-properties-interface"
- This PRD does not define complex state transition rules beyond Pebble validation. Applications may add additional validation
  logic
- "This PRD does not define batch operations (e.g., bulk dust, bulk update)"
- "This PRD does not define full-text search on crumb names or content"
- This PRD does not define property validation at the entity method level. Property methods may defer validation to Table.Set
  for simplicity
