id: "prd008-stash-interface"
title: Stash Interface
problem: |
  Crumbs are individual work items. Trails group them. But there is no mechanism for crumbs to share runtime state. When multiple agents coordinate on related tasks, they need shared resources (files, URLs, connections), artifacts (outputs from one crumb as inputs to another), context (decisions, configuration), and coordination primitives (locks, counters).

  Without shared state, agents must pass information through external channels or encode it in crumb properties, which conflates task attributes with coordination state. We need a dedicated entity for shared state that is scoped to a trail (or global), versioned, and auditable.

  This PRD defines the Stash entity: the struct fields, stash types, entity methods for value management and coordination, and how stashes interact with the Table interface.
goals:
- G1: Define the Stash struct with all required fields
- G2: Define stash types and their semantics
- G3: "Define entity methods for value access (SetValue, GetValue)"
- G4: Define entity methods for counter operations (Increment)
- G5: "Define entity methods for lock operations (Acquire, Release)"
- G6: Define history entry structure for backend tracking
- G7: "Specify how stashes are created, stored, and queried via the Table interface"
- G8: Document error conditions for entity operations
requirements:
  R1:
    title: Stash Struct
    items:
    - R1.1:
        text: The Stash struct must include the following fields
        weight: 1
    - R1.2:
        text: "StashID must be a UUID v7 (time-ordered) generated by the backend when Table.Set is called with an empty StashID"
        weight: 1
    - R1.3:
        text: "Stash scope (trail or global) uses the links table with `scoped_to` link type (see R13). Global stashes have\
          \ no `scoped_to` link"
        weight: 1
    - R1.4:
        text: "Name must be unique within scope. For trail-scoped stashes, name must be unique within that trail. For global\
          \ stashes, name must be unique among global stashes. Table.Set must reject duplicate names with ErrDuplicateName"
        weight: 1
    - R1.5:
        text: "Name must be non-empty. Table.Set must reject empty names with ErrInvalidName"
        weight: 1
    - R1.6:
        text: Version starts at 1 on creation and increments on every mutation. Version is never reset
        weight: 1
    - R1.7:
        text: Value is stored as a JSON blob. The structure depends on StashType (see R2)
        weight: 1
  R2:
    title: Stash Types
    items:
    - R2.1:
        text: A stash must have exactly one of the following types
        weight: 1
    - R2.2:
        text: StashType is stored as a string for JSON compatibility
        weight: 1
    - R2.3:
        text: StashType must be one of the valid types in 2.1. Table.Set must reject unrecognized types with ErrInvalidStashType
        weight: 1
    - R2.4:
        text: "Type-specific entity methods (R5, R6) validate that the stash has the correct type before operating"
        weight: 1
  R3:
    title: Creating Stashes
    items:
    - R3.1:
        text: "To create a new stash, the caller constructs a Stash struct and passes it to Table.Set"
        weight: 1
    - R3.2:
        text: "When Table.Set is called with an empty ID, the backend must generate a UUID v7 for StashID, set Version to\
          \ 1, set CreatedAt to now, validate Name is non-empty (ErrInvalidName if empty), validate Name is unique in scope\
          \ (ErrDuplicateName if exists), validate StashType is recognized (ErrInvalidStashType if not), and record a history\
          \ entry with operation \"create\""
        weight: 2
    - R3.3:
        text: "For lock type, initial Value should be nil (unlocked). For counter type, initial Value should be `{\"value\"\
          : 0}` or a specified starting value"
        weight: 1
    - R3.4:
        text: "After successful creation, the Stash struct is updated with the generated StashID, Version, and CreatedAt"
        weight: 1
  R4:
    title: Value Methods
    items:
    - R4.1:
        text: The Stash struct provides methods for value access
        weight: 1
    - R4.2:
        text: "SetValue updates the stash value. Must increment Version. Must return ErrInvalidStashType if called on a lock-type\
          \ stash (use Acquire/Release instead). After calling SetValue, the caller must save with Table.Set to persist changes"
        weight: 2
    - R4.4:
        text: Example usage
        weight: 1
  R5:
    title: Counter Operations
    items:
    - R5.1:
        text: The Stash struct provides a method for counter operations
        weight: 1
    - R5.2:
        text: "Increment atomically adds delta to the counter value. Must validate that StashType is \"counter\" (return ErrInvalidStashType\
          \ if not). Must extract current value from Value field, add delta, and store result. Must increment Version. Must\
          \ return the new counter value. Delta may be negative (decrement). After calling Increment, the caller must save\
          \ with Table.Set to persist changes"
        weight: 2
    - R5.3:
        text: Example usage
        weight: 1
  R6:
    title: Lock Operations
    items:
    - R6.1:
        text: The Stash struct provides methods for lock operations
        weight: 1
    - R6.2:
        text: "Acquire obtains the lock. Must validate that StashType is \"lock\" (return ErrInvalidStashType if not). Must\
          \ validate that holder is non-empty (return ErrInvalidHolder if empty). If the lock is not held (Value is nil),\
          \ set Value to `{\"holder\": holder, \"acquired_at\": now}`. If the lock is already held by the same holder, succeed\
          \ (reentrant). If the lock is held by another holder, return ErrLockHeld. Must increment Version. After calling\
          \ Acquire, the caller must save with Table.Set to persist changes"
        weight: 2
    - R6.3:
        text: "Release releases the lock. Must validate that StashType is \"lock\" (return ErrInvalidStashType if not). Must\
          \ validate that the lock is held by the specified holder (return ErrNotLockHolder if not). Must set Value to nil\
          \ (unlocked). Must increment Version. After calling Release, the caller must save with Table.Set to persist changes"
        weight: 2
    - R6.4:
        text: Example usage
        weight: 1
    - R6.5:
        text: "Lock operations are non-blocking. For waiting behavior, callers implement retry loops with backoff"
        weight: 1
  R7:
    title: History Tracking
    items:
    - R7.1:
        text: "The backend maintains a history log of stash mutations. History is backend-managed, not accessed through entity\
          \ methods"
        weight: 1
    - R7.2:
        text: StashHistoryEntry contains the following fields
        weight: 1
    - R7.3:
        text: Operation constants (defined in pkg/constants)
        weight: 1
    - R7.5:
        text: The StashHistoryEntry struct is defined in pkg/schema for backends to use when returning history data
        weight: 1
    - R7.6:
        text: "Backend must provide a method to query stash history entries by stash ID, returning entries ordered by version\
          \ ascending"
        weight: 2
  R8:
    title: Retrieving Stashes
    items:
    - R8.1:
        text: "To retrieve a stash by ID, use Table.Get"
        weight: 1
    - R8.2:
        text: "Table.Get returns the entity as any; the caller must type-assert to *Stash"
        weight: 1
    - R8.3:
        text: Table.Get returns ErrNotFound if no stash exists with the given ID
        weight: 1
    - R8.4:
        text: Table.Get returns ErrInvalidID if id is empty
        weight: 1
  R9:
    title: Filter Map
    items:
    - R9.1:
        text: "Filters are expressed as map[string]any where keys are filter names and values are filter criteria"
        weight: 3
    - R9.2:
        text: "Supported filter keys for stashes. To filter by trail scope, applications query the links table for `scoped_to`\
          \ links and use the resulting stash IDs"
        weight: 1
    - R9.3:
        text: An empty or nil filter matches all stashes
        weight: 1
    - R9.5:
        text: Unknown filter keys must be ignored (forward compatibility)
        weight: 1
    - R9.6:
        text: Results are ordered by CreatedAt ascending (oldest first)
        weight: 1
  R10:
    title: Querying Stashes
    items:
    - R10.1:
        text: "To query stashes by type, use Table.Fetch with a filter map"
        weight: 3
    - R10.2:
        text: "Table.Fetch returns a slice of entities ([]any); the caller must type-assert each element to *Stash"
        weight: 1
    - R10.3:
        text: Table.Fetch returns an empty slice (not nil) if no stashes match
        weight: 1
  R11:
    title: Deleting Stashes
    items:
    - R11.1:
        text: "To delete a stash, use Table.Delete"
        weight: 1
    - R11.2:
        text: Table.Delete removes the stash record and all its history
        weight: 2
    - R11.3:
        text: Table.Delete returns ErrNotFound if no stash exists with the given ID
        weight: 1
    - R11.4:
        text: Table.Delete returns ErrInvalidID if id is empty
        weight: 1
    - R11.5:
        text: Table.Delete returns ErrLockHeld if the stash is a lock and is currently held
        weight: 1
  R12:
    title: Error Types
    items:
    - R12.1:
        text: Stash entity methods and Table operations use sentinel errors defined in pkg/api
        weight: 1
    - R12.2:
        text: All errors are checkable with errors.Is
        weight: 1
    - R12.3:
        text: "Backend implementations may return additional errors for validation (e.g., duplicate names) as needed"
        weight: 1
  R13:
    title: Stash Scoping
    items:
    - R13.1:
        text: "A stash can be scoped to a trail via a `scoped_to` link in the links table"
        weight: 1
    - R13.2:
        text: "A stash can have at most one `scoped_to` link. The backend must enforce this constraint"
        weight: 1
    - R13.3:
        text: "Stashes without a `scoped_to` link are global (accessible from any trail)"
        weight: 1
    - R13.4:
        text: "Stash scoping is managed via the links table. Applications create `scoped_to` links using the Table interface\
          \ for the links table"
        weight: 1
    - R13.5:
        text: "To find which trail a stash is scoped to, query the links table for a `scoped_to` link where `from_id` equals\
          \ the stash ID"
        weight: 1
    - R13.6:
        text: "To find all stashes scoped to a trail, query the links table for `scoped_to` links where `to_id` equals the\
          \ trail ID"
        weight: 1
package_contract:
  exports:
  - name: Stash
    signature: "type Stash struct { StashID string; Name string; StashType string; Value any; Version int; CreatedAt time.Time\
      \ }"
  - name: StashHistoryEntry
    signature: "type StashHistoryEntry struct { StashID string; Version int; Operation string; Timestamp time.Time; Metadata\
      \ map[string]any }"
  - name: Stash.SetValue
    signature: "func (s *Stash) SetValue(value any) error"
  - name: Stash.Increment
    signature: "func (s *Stash) Increment(delta int64) (int64, error)"
  - name: Stash.Acquire
    signature: "func (s *Stash) Acquire(holder string) error"
  - name: Stash.Release
    signature: "func (s *Stash) Release(holder string) error"
  import_constraints:
  - pkg/schema must not import pkg/api or internal/
non_goals:
- This PRD does not define queue or channel stash types. These may be added in a future version
- "This PRD does not define stash replication or cross-cupboard sharing"
- This PRD does not define TTL or automatic expiration for stashes
- This PRD does not define access control or permissions on stashes
- This PRD does not define history compaction or pruning. History grows unbounded
- This PRD does not define blocking lock acquisition with timeout. Callers implement retry loops
