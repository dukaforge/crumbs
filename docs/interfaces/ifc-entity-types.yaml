id: ifc-entity-types
name: Entity Types
summary: |
  In-memory domain objects with state-transition methods. Entity methods modify struct fields
  only — no I/O, no database knowledge. All entities use UUID v7 identifiers.

data_structures:
  - name: Crumb
    description: Work item with state lifecycle. States are draft, pending, ready, taken, pebble (completed), and dust (failed/abandoned).
    fields:
      - name: CrumbID
        type: string
        description: UUID v7 identifier. Generated by backend on creation.
        required: true
      - name: Name
        type: string
        description: Human-readable name. Non-empty.
        required: true
      - name: State
        type: string
        description: Current state (draft|pending|ready|taken|pebble|dust). Initialized to "draft".
        required: true
      - name: CreatedAt
        type: timestamp
        description: Timestamp of creation. Set by backend.
        required: true
      - name: UpdatedAt
        type: timestamp
        description: Timestamp of last modification. Updated on any change.
        required: true
      - name: Properties
        type: map[string]any
        description: Map of property_id to value. Initialized with all defined properties on creation.
        required: true

  - name: Trail
    description: Exploration session with lifecycle. States are draft, pending, active, completed, and abandoned.
    fields:
      - name: TrailID
        type: string
        description: UUID v7 identifier. Generated by backend on creation.
        required: true
      - name: State
        type: string
        description: Current state (draft|pending|active|completed|abandoned). Initialized to "draft".
        required: true
      - name: CreatedAt
        type: timestamp
        description: Timestamp of creation. Set by backend.
        required: true
      - name: CompletedAt
        type: timestamp
        description: Timestamp when trail reached completed or abandoned state. Set by entity method.
        required: false

  - name: Property
    description: Property definition with typed values. Value types are categorical, text, integer, boolean, timestamp, and list.
    fields:
      - name: PropertyID
        type: string
        description: UUID v7 identifier. Generated on creation.
        required: true
      - name: Name
        type: string
        description: Unique property name. Non-empty.
        required: true
      - name: Description
        type: string
        description: Optional description.
        required: false
      - name: ValueType
        type: string
        description: One of categorical, text, integer, boolean, timestamp, or list.
        required: true
      - name: CreatedAt
        type: timestamp
        description: Timestamp of creation. Set by backend.
        required: true

  - name: Category
    description: Categorical value belonging to a property. Ordered by ordinal then name.
    fields:
      - name: CategoryID
        type: string
        description: UUID v7 identifier. Generated on creation.
        required: true
      - name: PropertyID
        type: string
        description: References parent Property.
        required: true
      - name: Name
        type: string
        description: Unique within property. Non-empty.
        required: true
      - name: Ordinal
        type: integer
        description: Display order. Lower ordinals first. Ties broken by name.
        required: true

  - name: Metadata
    description: Supplementary data attached to a crumb via a registered schema.
    fields:
      - name: MetadataID
        type: string
        description: UUID v7 identifier. Generated on creation.
        required: true
      - name: CrumbID
        type: string
        description: References crumb. Must exist.
        required: true
      - name: TableName
        type: string
        description: Schema name. Must be registered.
        required: true
      - name: PropertyID
        type: string
        description: Optional reference to a property.
        required: false
      - name: Content
        type: string
        description: Actual metadata content. Non-empty.
        required: true
      - name: CreatedAt
        type: timestamp
        description: Timestamp of creation. Set by backend.
        required: true

  - name: Link
    description: Typed directed edge between entities. Types are belongs_to, child_of, branches_from, and scoped_to.
    fields:
      - name: LinkID
        type: string
        description: UUID v7 identifier. Generated on creation.
        required: true
      - name: LinkType
        type: string
        description: One of belongs_to, child_of, branches_from, or scoped_to.
        required: true
      - name: FromID
        type: string
        description: Source entity ID. Type depends on LinkType.
        required: true
      - name: ToID
        type: string
        description: Target entity ID. Type depends on LinkType.
        required: true
      - name: CreatedAt
        type: timestamp
        description: Timestamp of creation. Set by backend.
        required: true

  - name: Stash
    description: Shared state scoped to a trail or global. Types are resource, artifact, context, counter, and lock.
    fields:
      - name: StashID
        type: string
        description: UUID v7 identifier. Generated on creation.
        required: true
      - name: Name
        type: string
        description: Unique within scope. Non-empty.
        required: true
      - name: StashType
        type: string
        description: One of resource, artifact, context, counter, or lock.
        required: true
      - name: Value
        type: any
        description: Type depends on StashType. JSON serializable.
        required: false
      - name: Version
        type: integer
        description: Starts at 1. Increments on every mutation.
        required: true
      - name: CreatedAt
        type: timestamp
        description: Timestamp of creation. Set by backend.
        required: true

operations:
  - name: Crumb.SetState
    description: Update crumb state. Validates state transitions. Updates UpdatedAt.
    parameters:
      - name: state
        type: string
        description: Target state.
    returns:
      - name: err
        type: error

  - name: Crumb.Pebble
    description: Transition to terminal pebble state. Requires "taken" state. Updates UpdatedAt.
    parameters: []
    returns:
      - name: err
        type: error

  - name: Crumb.Dust
    description: Transition to terminal dust state. Updates State and UpdatedAt.
    parameters: []
    returns:
      - name: err
        type: error

  - name: Crumb.SetProperty
    description: Set property value. Validates property exists, type matches, and category is valid. Updates UpdatedAt.
    parameters:
      - name: propertyID
        type: string
        description: Property identifier.
      - name: value
        type: any
        description: Property value. Must match property ValueType.
    returns:
      - name: err
        type: error

  - name: Trail.Complete
    description: Mark trail as completed. Requires "active" state. Sets CompletedAt to now. Backend cascades crumbs to pebble.
    parameters: []
    returns:
      - name: err
        type: error

  - name: Trail.Abandon
    description: Mark trail as abandoned. Requires "active" state. Sets CompletedAt to now. Backend cascades crumbs to dust.
    parameters: []
    returns:
      - name: err
        type: error

  - name: Stash.SetValue
    description: Update stash value. Not allowed for lock type. Increments Version.
    parameters:
      - name: value
        type: any
        description: New value.
    returns:
      - name: err
        type: error

  - name: Stash.Increment
    description: Add delta to counter value. Requires "counter" StashType. Returns new value. Increments Version.
    parameters:
      - name: delta
        type: integer
        description: Value to add (may be negative).
    returns:
      - name: newValue
        type: integer
      - name: err
        type: error

  - name: Stash.Acquire
    description: Obtain lock. Requires "lock" StashType and non-empty holder. Reentrant for same holder.
    parameters:
      - name: holder
        type: string
        description: Lock holder identifier.
    returns:
      - name: err
        type: error

  - name: Stash.Release
    description: Release lock. Requires "lock" StashType. Holder must match current lock holder.
    parameters:
      - name: holder
        type: string
        description: Lock holder identifier.
    returns:
      - name: err
        type: error

references:
  - srd003-crumbs-interface
  - srd004-properties-interface
  - srd005-metadata-interface
  - srd006-trails-interface
  - srd007-links-interface
  - srd008-stash-interface
